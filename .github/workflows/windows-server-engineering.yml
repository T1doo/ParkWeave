name: ParkWeave Windows Server engineering (mock only)

on:
  push:
    branches: [dev/f1-foundation]
    paths:
      - '.github/workflows/windows-server-engineering.yml'
      - 'scripts/windows_ci/**'
      - 'scripts/windows/**'
      - 'scripts/run_acceptance.py'
      - 'src/parkweave/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-windows-candidate.txt'

permissions:
  contents: read

concurrency:
  group: parkweave-server-engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server-engineering:
    name: Server 2025 / Python 3.12 x64 / native PG17 (not Win11 acceptance)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Anchor existing 25 minute job budget
        run: |
          # Conservative 30s allowance for bootstrap before this first step.
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()-30
          "PARKWEAVE_CI_JOB_STARTED=$started" | Add-Content -LiteralPath $env:GITHUB_ENV
          $uptime=[Math]::Max(0,[Environment]::TickCount64-30000)
          "PARKWEAVE_CI_JOB_UPTIME=$uptime" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Prepare fresh native loopback PostgreSQL and Python
        run: ./scripts/windows_ci/Engineering.ps1 -Action Prepare
      - name: Native lifecycle and local browser within shared job budget
        run: ./scripts/windows_ci/Engineering.ps1 -Action Lifecycle
      - name: Fixed native failure stages within original shared budget
        if: always()
        timeout-minutes: 2
        run: |
          & .\.venv-windows\Scripts\python.exe scripts/windows_ci/native_failure_oracles.py
      - name: Independent Server guard and four sequential regression shards
        if: always()
        run: ./scripts/windows_ci/Engineering.ps1 -Action Validation
      - name: Publish bounded current-run engineering diagnostics
        if: always()
        run: ./scripts/windows_ci/Engineering.ps1 -Action Publish
      - name: Stop only the owned temporary cluster
        if: always()
        run: ./scripts/windows_ci/Engineering.ps1 -Action Stop
# LOCAL CANDIDATE ONLY. Do not push/CI until capacity is reviewed.
# No workflow_dispatch-only dependency on main, paid runner, cache or artifact upload.
