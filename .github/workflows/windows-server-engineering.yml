name: ParkWeave Windows Server engineering (not Win11)

on:
  push:
    branches: [dev/f1-foundation, dev/local-product-runtime-20261028]
    paths:
      - '.github/workflows/windows-server-engineering.yml'
      - 'scripts/windows_ci/**'
      - 'scripts/windows/**'
      - 'scripts/run_acceptance.py'
      - 'src/parkweave/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-windows-candidate.txt'

permissions:
  contents: read

concurrency:
  group: parkweave-server-engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crt-cryptnet-cache-once:
    if: >-
      github.repository == 'T1doo/ParkWeave' && github.event.repository.private == false &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/dev/local-product-runtime-20261028' &&
      github.event.before == '42cc28f0db58bae87e72380f24061b3235cd9f2c' &&
      github.event.head_commit.message == 'ci: one native Cryptnet CRT recheck PW_CRT_CRYPTNET_20261101_E'
    name: Native temporary URL cache then unchanged strict WVT / no business
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Exact source checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Only reviewed source and explicit native cache scope
        timeout-minutes: 3
        shell: pwsh
        env:
          PW_CRYPTNET_PUBLIC: ${{ github.event.repository.private == false }}
          PW_CRYPTNET_SCOPE: REDIRECTS_AND_TEMPORARY_URL_CACHE
        run: |
          $ErrorActionPreference='Stop'
          $reviewedParent='42cc28f0db58bae87e72380f24061b3235cd9f2c'
          $current=(& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $current -ne $env:GITHUB_SHA) { throw 'EXACT_CACHE_SOURCE_REQUIRED' }
          $parent=(& git rev-parse 'HEAD^').Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -ne $reviewedParent) { throw 'REVIEWED_CACHE_PARENT_REQUIRED' }
          & git diff --quiet $reviewedParent HEAD -- . ':(exclude).github/workflows/windows-server-engineering.yml'
          if ($LASTEXITCODE -ne 0) { throw 'NO_OTHER_SOURCE_CHANGES_ALLOWED' }
          $dirty=@(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'CLEAN_CACHE_SOURCE_REQUIRED' }
          $cached=Join-Path $env:RUNNER_TOOL_CACHE 'Python'
          $versions=@(Get-ChildItem -LiteralPath $cached -Directory | Where-Object { $_.Name -match '^3\.12\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'EXISTING_PYTHON_312_UNAVAILABLE_NO_DOWNLOAD' }
          $python=Join-Path $versions[0].FullName 'x64\python.exe'
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'EXISTING_X64_PYTHON_UNAVAILABLE_NO_DOWNLOAD' }
          & $python -I -B -S scripts/windows_ci/crt_cryptnet_cache_trial.py --inspect-native-cache-once
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_CACHE_OR_STRICT_RECHECK_REFUSED_OR_UNKNOWN_NO_RETRY' }

  crt-signature-readonly:
    if: >-
      false && github.repository == 'T1doo/ParkWeave' && github.event.repository.private == false &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/dev/local-product-runtime-20261028' &&
      github.event.before == 'd21db941e0fbadc81aa0fce3d5e493ee4d6573e0' &&
      github.event.head_commit.message == 'ci: read-only CRT public metadata PW_CRT_RO_20261101_C'
    name: Read-only System32 CRT signatures / no native business acceptance
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Exact source checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read existing CRT signatures with existing Python only
        timeout-minutes: 2
        shell: pwsh
        env:
          PW_RO_PUBLIC: ${{ github.event.repository.private == false }}
          PW_RO_BEFORE: ${{ github.event.before }}
          PW_RO_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'EXACT_READONLY_SOURCE_REQUIRED' }
          $cached=Join-Path $env:RUNNER_TOOL_CACHE 'Python'
          $versions=@(Get-ChildItem -LiteralPath $cached -Directory | Where-Object { $_.Name -match '^3\.12\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          if ($versions.Count -eq 0) { throw 'EXISTING_PYTHON_312_UNAVAILABLE_NO_DOWNLOAD' }
          $python=Join-Path $versions[0].FullName 'x64\python.exe'
          if (!(Test-Path -LiteralPath $python -PathType Leaf)) { throw 'EXISTING_X64_PYTHON_UNAVAILABLE_NO_DOWNLOAD' }
          & $python -I -B -S scripts/windows_ci/crt_signature_readonly.py --run-readonly
          if ($LASTEXITCODE -ne 0) { throw 'READONLY_DIAGNOSTIC_UNKNOWN_NO_RETRY' }

  server-engineering:
    if: >-
      github.ref == 'refs/heads/dev/f1-foundation' ||
      (github.repository == 'T1doo/ParkWeave' && github.event.repository.private == false &&
       github.event_name == 'push' && github.run_attempt == 1 &&
       github.ref == 'refs/heads/dev/local-product-runtime-20261028' &&
       github.event.before == 'e152fd2988df5a3b1e65b7e2e84fd0aa5361565d' &&
       github.event.head_commit.message == 'ci: bounded Server 2025 source protocol PW_SERVER_PROTOCOL_20261030_A')
    name: Server 2025 / Python 3.12 x64 / isolated Job measurement (not Win11)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Anchor existing 25 minute job budget
        run: |
          # Conservative 30s allowance for bootstrap before this first step.
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()-30
          "PARKWEAVE_CI_JOB_STARTED=$started" | Add-Content -LiteralPath $env:GITHUB_ENV
          $uptime=[Math]::Max(0,[Environment]::TickCount64-30000)
          "PARKWEAVE_CI_JOB_UPTIME=$uptime" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python 3.12 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Independent controlled Job measurement without owner helpers
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $os=Get-CimInstance Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows Server 2025' -or $os.ProductType -eq 1) {
            throw 'NATIVE_SERVER_PLATFORM_REQUIRED'
          }
          if (!(Test-Path -LiteralPath '.runtime')) {
            New-Item -ItemType Directory -Path '.runtime' -ErrorAction Stop | Out-Null
          }
          # Ordinary exclusive fixture creation only; no SetOwner/Set-Acl.
          # No Engineering.ps1, PostgreSQL, app, pip, model or artifact upload.
          & python -m scripts.windows_ci.controlled_job_measurement --run-controlled
          if ($LASTEXITCODE -ne 0) { throw 'CONTROLLED_JOB_MEASUREMENT_NOT_PASSED' }
      - name: Isolate two existing pinned protocol dependencies
        if: github.ref == 'refs/heads/dev/local-product-runtime-20261028'
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('parkweave-source-protocol-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          & python -m venv (Join-Path $root 'venv')
          if ($LASTEXITCODE -ne 0) { throw 'PROTOCOL_VENV_FAILED' }
          $python=Join-Path $root 'venv\Scripts\python.exe'
          & $python -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --no-cache-dir --no-input --retries 0 --timeout 20 --only-binary=:all: 'psycopg[binary]==3.3.6' 'pydantic==2.13.5'
          if ($LASTEXITCODE -ne 0) { throw 'EXISTING_PROTOCOL_DEPENDENCY_UNAVAILABLE' }
          "PARKWEAVE_PROTOCOL_PYTHON=$python" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Compile current entry and check pure native composition without activation
        if: github.ref == 'refs/heads/dev/local-product-runtime-20261028'
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}/src
          PSYCOPG_IMPL: binary
          PW_PROTOCOL_SHA: ${{ github.sha }}
          PW_PROTOCOL_BEFORE: ${{ github.event.before }}
          PW_PROTOCOL_ATTEMPT: ${{ github.run_attempt }}
          PW_PROTOCOL_PUBLIC: ${{ github.event.repository.private == false }}
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD) -ne $env:PW_PROTOCOL_SHA) { throw 'EXACT_CHECKOUT_REQUIRED' }
          $files=@(Get-ChildItem scripts/windows -Filter '*.ps1' -File)
          foreach ($file in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw 'POWERSHELL_ENTRY_SYNTAX_REFUSED' }
          }
          Write-Output ('POWERSHELL_7_SYNTAX_FILES='+$files.Count+'; NOT_EXECUTED')
          & $env:PARKWEAVE_PROTOCOL_PYTHON -B -m scripts.windows_ci.local_product_source_protocol --run-protocol
          if ($LASTEXITCODE -ne 0) { throw 'LOCAL_PRODUCT_SOURCE_PROTOCOL_NOT_PASSED' }
