name: ParkWeave fictional guide real browser bounded

on:
  push:
    branches: [dev/pgdata-inheritance-source-20261026]
    paths: [scripts/template_browser_approval.json]

permissions:
  contents: read

concurrency:
  group: parkweave-fictional-browser-20261020
  cancel-in-progress: false

jobs:
  template-real-http-browser:
    if: >-
      github.repository == 'T1doo/ParkWeave' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev/pgdata-inheritance-source-20261026' &&
      github.event.repository.private == false &&
      github.run_attempt == 1 && github.run_number == 49
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PW_PUBLIC: ${{ github.event.repository.private == false }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:tests:.
    steps:
      - name: Checkout exact activation source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.ref_name }}
      - name: Bootstrap existing locked tools and approved private font
        timeout-minutes: 3
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          /usr/bin/python3.12 -m venv .runtime/fictional-browser-venv
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 \
            PIP_CONFIG_FILE=/dev/null PIP_DISABLE_PIP_VERSION_CHECK=1 \
            .runtime/fictional-browser-venv/bin/python -m pip install \
            --no-cache-dir --retries 0 --timeout 20 -r requirements-browser-smoke.txt
          .runtime/fictional-browser-venv/bin/python -B -m scripts.template_browser_hosted prepare
      - name: One real local HTTP and sandboxed Chrome integration
        timeout-minutes: 6
        run: |
          set -eu
          .runtime/fictional-browser-venv/bin/python -B -m scripts.template_browser_hosted execute
      - name: Preserve only bounded public result and four masked images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: template-real-http-browser-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/../scratch/parkweave-http-evidence-*/result.json
            ${{ github.workspace }}/../scratch/parkweave-http-evidence-*/*.png
          if-no-files-found: warn
          retention-days: 1
