<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐事项模板版本检查</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui;max-width:860px;margin:auto;padding:20px;color:#183b32;background:#f3f6f3}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea{width:100%;padding:10px;font:inherit}input[type=checkbox]{width:auto}button{font:inherit;min-height:44px;padding:10px;margin:6px;border:0;border-radius:6px;background:#22624d;color:white}button:disabled{opacity:.4}pre,p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){body,section{padding:12px}}</style>
<h1>逐事项模板版本检查</h1><p>检查新旧模板与本事项当前状态。先检查并记录选择，再单独确认采用可用的合成模板修订。采用只更新本事项的有效模板版本与受影响步骤检查状态；不执行预约、资源、分派或回执动作，仍需本人在原事项逐步重核。原绑定与历史保留；此入口不代表正式治理发布。</p>
<section><label>当前企业访问令牌<input id="token" type="password" autocomplete="off"></label><label>原模板实例 ID<input id="instance"></label><button id="catalog">读取当前候选版本</button><label>目标版本<select id="target"></select></label><button id="check" disabled>检查此事项版本</button><p id="result" aria-live="polite"></p><label>本次选择说明<textarea id="reason"></textarea></label><button data-choice="KEEP_CURRENT" disabled>保留旧版</button><button data-choice="REQUEST_RECHECK" disabled>记录人工重验意向</button><button data-choice="ACK_COMPATIBLE" disabled>确认兼容检查</button><p id="error" role="alert"></p><pre id="receipt"></pre><label>原选择请求键<input id="key"></label><button id="recover">只读核对原选择</button><hr><p id="application" aria-live="polite"></p><label>采用修订的明确原因<textarea id="apply-reason"></textarea></label><label><input id="apply-confirm" type="checkbox">我确认仅采用本事项模板修订与失效检查；资源、预约、回执及已发生效果不会撤销，随后仍由本人在原事项明确重核。</label><label id="structure-confirm-label" hidden><input id="structure-confirm" type="checkbox">我明确确认新增模板必需目标及其注册步骤闭包仅采用到本事项既有目标与计划；原 Case 目标、步骤 ID 和业务历史保留，受影响步骤须由本人重新验证。</label><pre id="note-carry-preview" hidden></pre><label id="note-carry-confirm-label" hidden><input id="note-carry-confirm" type="checkbox">我已核对旧新模板及来源，明确保留上述本人 MANUAL 正文和历史采用到本事项的新版本；旧继续决定不代替本次确认，原文保全不表示事实、义务或履约满足，受影响步骤仍需本人逐项重核。</label><button id="apply" disabled>明确采用本事项模板修订</button><label>原采用请求键<input id="apply-key"></label><button id="apply-recover">只读核对原采用</button><p id="apply-receipt" aria-live="polite"></p><a id="original-case" hidden>打开原事项逐步重核</a><a href="/template">原模板入口</a></section>
<script>
const $=id=>document.getElementById(id);let generation=0,inspection=null,pending=null,busy=false;
function context(){return {generation,token:$('token').value,instance:$('instance').value,target:$('target').value};}
function current(c){return JSON.stringify(c)===JSON.stringify(context());}
function buttons(){const blocked=busy||!!pending;$('catalog').disabled=blocked;$('check').disabled=blocked||!$('target').value||!$('instance').value;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=blocked||!inspection?.check.allowed_choices.includes(b.dataset.choice));$('reason').disabled=blocked;$('recover').disabled=busy||pending?.kind==='apply';$('key').disabled=busy||!!pending;$('apply').disabled=blocked||!applicationReady()||!$('apply-confirm').checked||!structureConfirmed()||!noteCarryConfirmed()||!$('apply-reason').value.trim();$('apply-confirm').disabled=blocked;$('structure-confirm').disabled=blocked;$('note-carry-confirm').disabled=blocked;$('apply-reason').disabled=blocked;$('apply-recover').disabled=busy||pending?.kind==='choice';$('apply-key').disabled=busy||!!pending;}
function resetConfirmations(){$('apply-confirm').checked=false;$('structure-confirm').checked=false;$('structure-confirm-label').hidden=true;$('note-carry-confirm').checked=false;$('note-carry-confirm-label').hidden=true;$('note-carry-preview').hidden=true;$('note-carry-preview').textContent='';}
function clear(dropCatalog=false){generation++;inspection=null;pending=null;busy=false;for(const id of ['result','error','receipt','application','apply-receipt'])$(id).textContent='';$('key').value='';$('reason').value='';$('apply-key').value='';$('apply-reason').value='';resetConfirmations();$('original-case').hidden=true;$('original-case').href='';if(dropCatalog)$('target').replaceChildren();buttons();}
async function call(c,url,method='GET',body,key){let r,x;try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json',...(key?{'Idempotency-Key':key}:{})},body:body?JSON.stringify(body):undefined});x=await r.json();}catch(e){if(!current(c))throw Error('STALE');e.unknown=method==='POST';throw e;}if(!current(c))throw Error('STALE');if(!r.ok){const e=Error(r.status===403?'当前身份或范围无权访问':r.status===409?'版本、来源或选择记录已变化，请重新检查':r.status===422?'输入不符合检查合同':'请求未完成');e.unknown=method==='POST'&&r.status>=500;e.denied=r.status===403;throw e;}return x;}
function fail(c,e){if(e.message==='STALE'||!current(c))return;if(e.denied)clear(true);$('error').textContent=e.unknown?'结果未知，请保留原请求键并只读核对；未观察到记录不等于原请求不会迟到。':e.message;}
function applicationReady(){const a=inspection?.application;return !!((a?.requires_note_carry_confirmation===true?noteCarryReady(a):a?.eligible===true) && a.choice_revision===inspection.revision && a.choice_revision>0 && a.choice_event_sha256 && a.plan_id && a.plan_revision>0 && a.preparation_revision>0 && a.source_sha256 && (a.requires_structure_confirmation!==true||(a.structure_change&&/^[a-f0-9]{64}$/.test(a.structure_sha256))) && ['COMPATIBLE','NEEDS_RECHECK'].includes(inspection.check.classification));}
function structureConfirmed(){return inspection?.application?.requires_structure_confirmation!==true||$('structure-confirm').checked===true;}
function noteCarryReady(a){const n=a?.note_carry;return !!(a.requires_note_carry_confirmation===true&&a.requires_structure_confirmation!==true&&n?.schema===1&&n.eligible===true&&n.client_validated===true&&n.manual_preserved===true&&n.requires_confirmation===true&&n.proof?.version===1&&n.proof.scope==='OWNER_MANUAL_NOTE_TEMPLATE_CARRY'&&n.proof.sha256===a.note_carry_sha256&&n.preview_sha256===a.note_carry_sha256&&/^[a-f0-9]{64}$/.test(a.note_carry_sha256));}
async function validateNoteCarryPreview(v){const a=v?.application;if(a?.requires_note_carry_confirmation!==true)return;const n=a.note_carry;if(!n)return;n.client_validated=false;if(!n.proof)return;const z=n.proof,body={...z};delete body.sha256;
 if(z.version!==1||z.scope!=='OWNER_MANUAL_NOTE_TEMPLATE_CARRY'||z.semantic_evaluated!==false||await proofHash(body)!==z.sha256||z.sha256!==a.note_carry_sha256||z.sha256!==n.preview_sha256||await proofHash(v.check)!==v.check_sha256||z.check_sha256!==v.check_sha256||canonicalProof(z.binding)!==canonicalProof(v.check.scope)||z.plan_ref?.plan_id!==a.plan_id||z.plan_ref?.plan_revision!==a.plan_revision||canonicalProof(n.notes)!==canonicalProof(z.notes)||canonicalProof(n.affected)!==canonicalProof(z.affected)||canonicalProof(n.preserved)!==canonicalProof(z.preserved)||canonicalProof(a.affected)!==canonicalProof(z.affected)||canonicalProof(a.preserved)!==canonicalProof(z.preserved)||z.source_changed!==n.template_source_changed||await proofHash(n.previous_template_source)!==z.previous_release?.source_sha256||await proofHash(n.target_template_source)!==z.target_release?.source_sha256)throw Error('携注记预览与当前模板、正文或来源不一致，请重新检查');n.client_validated=true;}
function noteCarryConfirmed(){return inspection?.application?.requires_note_carry_confirmation!==true||$('note-carry-confirm').checked===true;}
function showNoteCarry(a){if(a?.requires_note_carry_confirmation!==true)return;const n=a.note_carry;$('note-carry-confirm-label').hidden=false;$('note-carry-preview').hidden=false;$('note-carry-preview').textContent=n?'本人注记跨版本保全：'+(n.eligible?'等待本次明确确认':'当前拒绝')+'\n原因：'+(n.blockers||[]).join('、')+'\n旧模板 '+n.proof?.previous_release?.release_id+' · 内容版本 '+inspection.check.comparison_content_version+'\n新模板 '+n.proof?.target_release?.release_id+' · 内容版本 '+inspection.check.target_content_version+'\n旧模板来源：'+JSON.stringify(n.previous_template_source)+'\n新模板来源：'+JSON.stringify(n.target_template_source)+'\n本人 MANUAL 原正文：\n'+Object.values(n.notes||{}).map(x=>x.text).join('\n')+'\n当前事项材料：'+JSON.stringify(n.proof?.materials?.current)+'\n受影响步骤：'+(n.affected||[]).join('、')+'\n保留步骤、锁与历史：'+(n.preserved||[]).join('、')+'\n保全原文不代表业务义务已满足；模板来源变化后须重核全部受影响步骤。':'当前没有可确认的本人注记保全证明。';}
function showApplication(){const a=inspection?.application;resetConfirmations();$('structure-confirm-label').hidden=a?.requires_structure_confirmation!==true;$('application').textContent=a?(a.requires_structure_confirmation?'模板结构变化：原 Case 目标、步骤 ID 和业务历史保持；明确采用后仅重验受影响步骤。\n新增模板必需目标：'+(a.structure_change?.added_goals||[]).join('、')+'\n新增模板注册步骤闭包：'+(a.structure_change?.added_template_steps||[]).join('、')+'\n':'')+'当前有效模板 '+a.effective_release_id+'\n采用资格：'+((a.requires_note_carry_confirmation?noteCarryReady(a):a.eligible)?'可在明确确认后采用':'当前拒绝')+'\n原因：'+(a.requires_note_carry_confirmation?(a.note_carry?.blockers||[]):(a.blockers||[])).join('、')+'\n受影响步骤：'+(a.affected||[]).join('、')+'\n保留步骤与历史：'+(a.preserved||[]).join('、'):'尚无可执行的采用证明，请先记录明确选择并重新检查。';showNoteCarry(a);}
function choiceReceipt(x,key){return !!(x.event?.request_key===key&&x.event.scope?.instance_id===$('instance').value&&x.event.migration_performed===false);}
function canonicalProof(value){if(Array.isArray(value))return '['+value.map(canonicalProof).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+canonicalProof(value[k])).join(',')+'}';return JSON.stringify(value);}
async function proofHash(value){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonicalProof(value))))).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function applicationReceipt(x,key,original=null){try{const e=x.event,p=e?.template_upgrade,r=p?.request,c=p?.check,q=p?.choice,s=c?.scope,t=p?.target_release,b=p?.previous_release,o=p?.origin_binding;
 const structural=Object.hasOwn(p||{},'structure_change'),carried=Object.hasOwn(p||{},'note_carry');if(structural&&carried)return false;
 const fields=['expected_instance_id','target_release_id','expected_target_sha256','expected_check_sha256','expected_choice_revision','expected_choice_event_sha256','expected_plan_id','expected_plan_revision','expected_preparation_revision','expected_source_sha256','reason',...(structural?['expected_structure_sha256','confirm_structure_change']:[]),...(carried?['expected_note_carry_sha256','confirm_note_carry']:[])];
 const text=v=>typeof v==='string'&&v.length>0&&v.length<=1000,hash=v=>typeof v==='string'&&/^[a-f0-9]{64}$/.test(v),rev=(v,max)=>Number.isInteger(v)&&v>=1&&v<=max;
 if(x.scope!=='OWNED_SYNTHETIC_TEMPLATE_MIGRATION_V1'||x.migration_performed!==true||x.automatically_replayed!==false||x.automatic_execution!==false||x.new_grants!==false||x.formal_review!==false||x.business_publication!==false||x.case_goal_completed!==false||!r||Object.keys(r).length!==fields.length||!fields.every(k=>Object.hasOwn(r,k))||!text(r.expected_instance_id)||r.expected_instance_id!==$('instance').value||!text(r.target_release_id)||!text(r.expected_plan_id)||!text(r.reason)||r.reason!==r.reason.trim()||!rev(r.expected_choice_revision,64)||!rev(r.expected_plan_revision,63)||!rev(r.expected_preparation_revision,64)||!['expected_target_sha256','expected_check_sha256','expected_choice_event_sha256','expected_source_sha256'].every(k=>hash(r[k])))return false;
 if(original&&(Object.keys(original).length!==fields.length||!fields.every(k=>r[k]===original[k])))return false;
 const patchFields=['request','check','choice','target_release','previous_release','origin_binding','source_changed','affected','preserved',...(structural?['structure_change']:[]),...(carried?['note_carry']:[])];if(Object.keys(p).length!==patchFields.length||!patchFields.every(k=>Object.hasOwn(p,k)))return false;
 if(!text(e.id)||e.action!=='TEMPLATE_UPGRADE'||e.request_key!==key||e.plan_id!==r.expected_plan_id||e.revision!==r.expected_plan_revision+1||e.reason!==r.reason||e.coordination_only!==true||e.step_id!==null||e.sources!==null||e.source_sha256!==null||!s||s.instance_id!==r.expected_instance_id||e.actor_id!==s.actor_id||!['actor_id','park_id','org_id','database_name','case_id','preparation_id'].every(k=>text(s[k]))||o?.actor_id!==s.actor_id||o.park_id!==s.park_id||o.org_id!==s.org_id||o.database_name!==s.database_name)return false;
 if(x.effective_release_id!==r.target_release_id||t?.release_id!==r.target_release_id||t.release_sha256!==r.expected_target_sha256||c.target_release_id!==r.target_release_id||c.target_release_sha256!==r.expected_target_sha256||c.case_state_sha256!==r.expected_source_sha256||!['COMPATIBLE','NEEDS_RECHECK'].includes(c.classification)||!Array.isArray(c.allowed_choices)||!q||!['REQUEST_RECHECK','ACK_COMPATIBLE'].includes(q.choice)||!c.allowed_choices.includes(q.choice)||q.revision!==r.expected_choice_revision||q.event_sha256!==r.expected_choice_event_sha256||q.check_sha256!==r.expected_check_sha256||canonicalProof(q.scope)!==canonicalProof(s)||canonicalProof(q.check)!==canonicalProof(c)||q.migration_performed!==false)return false;
 if(!Array.isArray(p.affected)||!Array.isArray(p.preserved)||p.affected.length+p.preserved.length<1||p.affected.length+p.preserved.length>5||![...p.affected,...p.preserved].every(text)||new Set([...p.affected,...p.preserved]).size!==p.affected.length+p.preserved.length)return false;
 const releases=[{release_id:o.release_id,release_sha256:o.release_sha256,snapshot:o.release_snapshot},b,t];
 for(const release of releases){const snapshot=release?.snapshot;if(!snapshot||snapshot.release_id!==release.release_id||!hash(release.release_sha256)||!hash(snapshot.definition_sha256)||snapshot.scope?.park_id!==s.park_id||snapshot.business_publication!==false||snapshot.automatic_execution!==false||snapshot.new_grants!==false||snapshot.case_goal_completed!==false||snapshot.deployment_enabled!==false||!Number.isInteger(snapshot.content_version)||snapshot.content_version<1||await proofHash(snapshot)!==release.release_sha256||await proofHash(snapshot.definition)!==snapshot.definition_sha256)return false;}
 if(b.snapshot.content_version>=t.snapshot.content_version||canonicalProof(b.snapshot.scope)!==canonicalProof(t.snapshot.scope)||canonicalProof(o.release_snapshot.scope)!==canonicalProof(t.snapshot.scope)||o.release_snapshot.content_version>b.snapshot.content_version||o.definition_sha256!==o.release_snapshot.definition_sha256||b.snapshot.registry_sha256!==t.snapshot.registry_sha256||b.snapshot.contract_sha256!==t.snapshot.contract_sha256)return false;
 for(const field of ['service_id','service_version','parameter_schema',...(!structural?['required_goals','steps']:[])])if(canonicalProof(b.snapshot.definition[field])!==canonicalProof(t.snapshot.definition[field]))return false;
 const changed=canonicalProof(b.snapshot.definition.source)!==canonicalProof(t.snapshot.definition.source);if(p.source_changed!==changed||(changed?p.preserved.length!==0||p.affected.length===0:!structural&&p.affected.length!==0))return false;
 if(structural){
  const z=p.structure_change,keys=['version','kind','before_release_id','before_release_sha256','target_release_id','target_release_sha256','before_definition_sha256','target_definition_sha256','added_goals','added_template_steps','seed_adapters','affected_step_ids','preserved_step_ids','case_binding_sha256'];
  if(!z||Object.keys(z).length!==keys.length||!keys.every(k=>Object.hasOwn(z,k))||z.version!==1||z.kind!=='REGISTERED_GOAL_STRENGTHENING'||r.confirm_structure_change!==true||!hash(r.expected_structure_sha256)||await proofHash(z)!==r.expected_structure_sha256||!hash(z.case_binding_sha256)||z.before_release_id!==b.release_id||z.before_release_sha256!==b.release_sha256||z.target_release_id!==t.release_id||z.target_release_sha256!==t.release_sha256||z.before_definition_sha256!==b.snapshot.definition_sha256||z.target_definition_sha256!==t.snapshot.definition_sha256||canonicalProof(z.affected_step_ids)!==canonicalProof(p.affected)||canonicalProof(z.preserved_step_ids)!==canonicalProof(p.preserved)||p.affected.length===0)return false;
  const oldGoals=b.snapshot.definition.required_goals,newGoals=t.snapshot.definition.required_goals,oldSteps=b.snapshot.definition.steps,newSteps=t.snapshot.definition.steps;
  if(!Array.isArray(oldGoals)||!Array.isArray(newGoals)||newGoals.length<=oldGoals.length||newGoals.length>6||new Set(newGoals).size!==newGoals.length||!oldGoals.every((g,i)=>g===newGoals[i])||canonicalProof(z.added_goals)!==canonicalProof(newGoals.slice(oldGoals.length))||!Array.isArray(oldSteps)||!Array.isArray(newSteps)||newSteps.length>5||new Set(newSteps.map(n=>n.id)).size!==newSteps.length||!oldSteps.every((n,i)=>canonicalProof(n)===canonicalProof(newSteps[i])))return false;
  const addedSteps=newSteps.filter(n=>!oldSteps.some(o=>o.id===n.id)).map(n=>n.id),adapters={LOCAL_MATERIAL_PREPARATION:'P1',LOCAL_CASE_RESOURCE_ASSOCIATION:'P2',LOCAL_INTERNAL_ACCEPTANCE:'P3',LOCAL_SYNTHETIC_RECEIPT_ACKNOWLEDGEMENT:'P4',LOCAL_SYNTHETIC_COORDINATION_RECORDS:'P4',LOCAL_CASE_RECORD_RECHECK:'P5'},seeds=[...new Set([...addedSteps,...z.added_goals.map(g=>adapters[g])])].sort();
  if(!newGoals.every(g=>Object.hasOwn(adapters,g))||canonicalProof(z.added_template_steps)!==canonicalProof(addedSteps)||canonicalProof(z.seed_adapters)!==canonicalProof(seeds))return false;
 }

 if(carried&&!await noteCarryReceipt(p.note_carry,p,r))return false;
 const savedChoice={...q};delete savedChoice.event_sha256;
 return await proofHash(c)===r.expected_check_sha256&&await proofHash(savedChoice)===r.expected_choice_event_sha256&&await proofHash({instance_id:r.expected_instance_id,action:'TEMPLATE_UPGRADE',...r})===e.fingerprint;
 }catch{return false;}}
function noteCarryNonemptyText(text){return /[^\t\n\v\f\r \x1c-\x1f\x85\xa0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]/u.test(text);}
async function noteCarryReceipt(z,p,r){
 const exact=(v,keys)=>!!v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length===keys.length&&keys.every(k=>Object.hasOwn(v,k)),hash=v=>typeof v==='string'&&/^[a-f0-9]{64}$/.test(v);
 const keys=['version','scope','binding','plan_ref','notes','ledger','materials','case_versions','previous_release','target_release','check_sha256','choice_revision','choice_event_sha256','source_changed','affected','preserved','semantic_evaluated','sha256'];
 if(!exact(z,keys)||z.version!==1||z.scope!=='OWNER_MANUAL_NOTE_TEMPLATE_CARRY'||z.semantic_evaluated!==false||r.confirm_note_carry!==true||!hash(r.expected_note_carry_sha256)||z.sha256!==r.expected_note_carry_sha256||canonicalProof(z.binding)!==canonicalProof(p.check.scope)||z.check_sha256!==r.expected_check_sha256||z.choice_revision!==r.expected_choice_revision||z.choice_event_sha256!==r.expected_choice_event_sha256||z.source_changed!==p.source_changed||canonicalProof(z.affected)!==canonicalProof(p.affected)||canonicalProof(z.preserved)!==canonicalProof(p.preserved))return false;
 const body={...z};delete body.sha256;if(await proofHash(body)!==z.sha256)return false;
 if(!exact(z.plan_ref,['plan_id','plan_revision','initial_adopt_fingerprint','steps_sha256','required_goals_sha256','binding_sha256'])||z.plan_ref.plan_id!==r.expected_plan_id||z.plan_ref.plan_revision!==r.expected_plan_revision||!['initial_adopt_fingerprint','steps_sha256','required_goals_sha256','binding_sha256'].every(k=>hash(z.plan_ref[k]))||!exact(z.ledger,['revision','sha256'])||!Number.isInteger(z.ledger.revision)||z.ledger.revision<0||z.ledger.revision>128||!hash(z.ledger.sha256))return false;
 for(const [name,release] of [['previous_release',p.previous_release],['target_release',p.target_release]]){const ref=z[name];if(!exact(ref,['release_id','release_sha256','definition_sha256','source_sha256'])||ref.release_id!==release.release_id||ref.release_sha256!==release.release_sha256||ref.definition_sha256!==release.snapshot.definition_sha256||await proofHash(release.snapshot.definition.source)!==ref.source_sha256)return false;}
 if(!z.notes||typeof z.notes!=='object'||Array.isArray(z.notes)||Object.keys(z.notes).length!==1||!exact(z.materials,['current','current_epochs','captured_epochs']))return false;
 const [step,n]=Object.entries(z.notes)[0],nk=['version','revision','text','text_sha256','origin','source_ref','source_package','verified_package_sha256','event_id','plan_id','step_id'];
 if(!exact(n,nk)||n.version!==1||n.origin!=='MANUAL'||n.plan_id!==r.expected_plan_id||n.step_id!==step||![...p.affected,...p.preserved].includes(step)||!Number.isInteger(n.revision)||n.revision<1||n.revision>64||typeof n.text!=='string'||!noteCarryNonemptyText(n.text)||Array.from(n.text).length>4000||!hash(n.text_sha256)||typeof n.event_id!=='string')return false;
 const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.text)))).map(b=>b.toString(16).padStart(2,'0')).join('');if(digest!==n.text_sha256)return false;
 for(const name of ['current','current_epochs','captured_epochs']){const items=z.materials[name];if(!Array.isArray(items)||items.length!==2||new Set(items.map(m=>m.slot)).size!==2||!items.every(m=>['need_summary','material_outline'].includes(m.slot)&&typeof m.id==='string'&&Number.isInteger(m.version)&&m.version>0&&hash(m.source_sha256)))return false;}
 if(!Array.isArray(n.source_package)||n.source_package.length!==2)return false;
 const current=z.materials.current.find(m=>m.slot==='material_outline');if(!exact(n.source_ref,['id','slot','version','source_sha256'])||!Object.keys(n.source_ref).every(k=>n.source_ref[k]===current[k]))return false;
 const cv=z.case_versions;if(!exact(cv,['preparation_epoch','case_epoch','run_epoch','source_epochs_sha256','action_grant_epochs'])||!hash(cv.source_epochs_sha256)||!['preparation_epoch','case_epoch','run_epoch'].every(k=>typeof cv[k]==='string'&&/^[0-9]+$/.test(cv[k]))||!Array.isArray(cv.action_grant_epochs)||cv.action_grant_epochs.length>32)return false;
 return true;
}
function originalCaseLink(c){$('original-case').href='/?template_instance='+encodeURIComponent(c.instance);$('original-case').hidden=false;}
function applicationSummary(x){return '当前有效模板 '+x.effective_release_id+'\n采用事件 '+x.event.id+' · 计划版本 '+x.event.revision+'\n受影响步骤 '+x.event.template_upgrade.affected.length+'；保留步骤 '+x.event.template_upgrade.preserved.length;}
$('note-carry-confirm').onchange=buttons;$('apply-confirm').onchange=buttons;$('structure-confirm').onchange=buttons;$('apply-reason').oninput=buttons;
function url(c){return '/api/template-upgrade/'+encodeURIComponent(c.instance);}
$('token').oninput=()=>clear(true);$('instance').oninput=()=>clear(true);$('target').onchange=()=>clear();
$('catalog').onclick=async()=>{if(busy||pending)return;const c=context();busy=true;buttons();try{const x=await call(c,'/api/template-consumer/catalog');$('target').replaceChildren();for(const t of x.templates){const o=document.createElement('option');o.textContent=t.name+' · '+t.release_id;o.value=t.release_id;o.dataset.hash=t.release_sha256;$('target').append(o);}generation++;inspection=null;busy=false;buttons();}catch(e){fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
$('check').onclick=async()=>{if(busy||pending)return;const c=context(),o=$('target').selectedOptions[0];if(!o)return;busy=true;buttons();try{inspection=await call(c,url(c)+'/check?'+new URLSearchParams({target_release_id:o.value,target_sha256:o.dataset.hash}));await validateNoteCarryPreview(inspection);if(!current(c))throw Error('STALE');const names={COMPATIBLE:'兼容；原待办理步骤仍未完成',NEEDS_RECHECK:'需人工重验',LOCK_CONFLICT:'人工锁冲突；请在原入口处理',BREAKING_REJECTED:'破坏性升级拒绝'};$('result').textContent=names[inspection.check.classification]+' · 内容版本 '+inspection.check.original_content_version+' → '+inspection.check.target_content_version+' · 来源版本 '+inspection.check.original_source_revision+' → '+inspection.check.target_source_revision+'\n'+inspection.check.changes.join('、');$('receipt').textContent='旧版 '+inspection.check.original_release_id+'\n目标 '+inspection.check.target_release_id+'\n历史选择 '+inspection.revision; showApplication();$('error').textContent='';}catch(e){if(current(c)){inspection=null;$('application').textContent='';resetConfirmations();};fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
async function choose(choice){const c=context();if(busy)return;if(!inspection||pending)return;pending={kind:'choice',url:url(c)+'/choices',key:crypto.randomUUID(),body:{target_release_id:inspection.check.target_release_id,expected_target_sha256:inspection.check.target_release_sha256,expected_check_sha256:inspection.check_sha256,expected_revision:inspection.revision,choice,reason:$('reason').value}};$('key').value=pending.key;if(!pending)return;busy=true;buttons();try{const x=await call(c,pending.url,'POST',pending.body,pending.key);if(!choiceReceipt(x,pending.key)||x.event.choice!==pending.body.choice||x.event.check.target_release_id!==pending.body.target_release_id){const e=Error('选择回执与原请求不符，请只读核对原键');e.unknown=true;throw e;}pending=null;inspection=null;$('application').textContent='选择已记录；请重新检查，再单独确认采用。';resetConfirmations();$('receipt').textContent='已记录选择；原旧版保持\n'+JSON.stringify(x.event);$('error').textContent='';}catch(e){if(current(c)){if(!e.unknown){pending=null;inspection=null;$('application').textContent='';resetConfirmations();}fail(c,e);}}finally{if(current(c)){busy=false;buttons();}}}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));
$('recover').onclick=async()=>{const c=context();if(busy||pending?.kind==='apply')return;busy=true;buttons();try{const key=pending?.kind==='choice'?pending.key:$('key').value,x=await call(c,url(c)+'/requests/'+encodeURIComponent(key));if(x.status==='COMMITTED'&&!choiceReceipt(x,key))throw Error('原选择回执与当前实例或原键不符');if(!['COMMITTED','NOT_OBSERVED'].includes(x.status))throw Error('原选择状态无法核对');$('receipt').textContent=x.status+' · 历史选择，只读\n'+JSON.stringify(x.event);if(x.status==='COMMITTED'){pending=null;inspection=null;buttons();}}catch(e){fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
$('apply').onclick=async()=>{const c=context();if(busy||pending||!applicationReady()||!$('apply-confirm').checked||!structureConfirmed()||!noteCarryConfirmed()||!$('apply-reason').value.trim())return;const a=inspection.application;pending={kind:'apply',url:url(c)+(a.requires_note_carry_confirmation?'/apply-note-carry':a.requires_structure_confirmation?'/apply-structure':'/apply'),key:crypto.randomUUID(),body:{expected_instance_id:c.instance,target_release_id:inspection.check.target_release_id,expected_target_sha256:inspection.check.target_release_sha256,expected_check_sha256:inspection.check_sha256,expected_choice_revision:a.choice_revision,expected_choice_event_sha256:a.choice_event_sha256,expected_plan_id:a.plan_id,expected_plan_revision:a.plan_revision,expected_preparation_revision:a.preparation_revision,expected_source_sha256:a.source_sha256,reason:$('apply-reason').value.trim(),...(a.requires_structure_confirmation?{expected_structure_sha256:a.structure_sha256,confirm_structure_change:true}:{}),...(a.requires_note_carry_confirmation?{expected_note_carry_sha256:a.note_carry_sha256,confirm_note_carry:true}:{})}};$('apply-key').value=pending.key;busy=true;buttons();try{const x=await call(c,pending.url,'POST',pending.body,pending.key);const accepted=await applicationReceipt(x,pending.key,pending.body);if(!current(c))throw Error('STALE');if(!accepted){const e=Error('采用回执与原请求不符，请只读核对原键');e.unknown=true;throw e;}pending=null;inspection=null;resetConfirmations();$('application').textContent='采用结果已返回；需要重新检查，并在原事项明确重核受影响步骤。';$('apply-receipt').textContent='采用已记录；不代表履约或重核已完成\n'+applicationSummary(x);originalCaseLink(c);$('error').textContent='';}catch(e){if(current(c)){if(!e.unknown){pending=null;inspection=null;$('application').textContent='';resetConfirmations();}fail(c,e);}}finally{if(current(c)){busy=false;buttons();}}};
$('apply-recover').onclick=async()=>{const c=context();if(busy||pending?.kind==='choice')return;busy=true;buttons();try{const key=pending?.kind==='apply'?pending.key:$('apply-key').value,x=await call(c,url(c)+'/apply-requests/'+encodeURIComponent(key));const accepted=x.status!=='COMMITTED'||await applicationReceipt(x,key,pending?.kind==='apply'?pending.body:null);if(!current(c))throw Error('STALE');if(!accepted)throw Error('原采用回执与当前实例、原键或原请求不符');if(!['COMMITTED','NOT_OBSERVED'].includes(x.status))throw Error('原采用状态无法核对');$('apply-receipt').textContent=x.status+' · 原采用结果，只读；未观察到不等于未提交\n'+(x.status==='COMMITTED'?applicationSummary(x):'请保留原请求键，稍后继续只读核对。');if(x.status==='COMMITTED'){pending=null;inspection=null;$('application').textContent='已核对原采用；请重新检查，在原事项明确重核。';resetConfirmations();originalCaseLink(c);}}catch(e){fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
buttons();
</script></html>
