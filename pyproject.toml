[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parkweave"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "psycopg[binary]==3.3.6", "pydantic==2.13.5", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "setuptools==80.9.0"]
linux-test-db = ["pgserver==0.1.4"]

[tool.setuptools.package-data]
parkweave = ["schema.sql", "roles.sql", "migration-002.sql", "migration-003.sql", "migration-004.sql", "migration-005.sql", "migration-006.sql", "migration-007.sql", "migration-008.sql", "migration-009.sql", "migration-010.sql", "migration-011.sql", "migration-012.sql", "migration-013.sql", "migration-014.sql", "migration-015.sql", "migration-016.sql", "migration-017.sql", "migration-018.sql", "migration-019.sql", "migration-020.sql", "migration-021.sql", "migration-022.sql", "migration-023.sql", "migration-024.sql", "migration-025.sql", "migration-026.sql", "migration-027.sql", "quota.sql", "roles-fault-fixture.sql", "web.html", "rule_publication_candidate_web.html", "run_access_candidate_web.html", "review_demo_web.html", "review_demo_sources.json", "template_candidate_web.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
