<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParkWeave 本地评审路径</title>
<style>*{box-sizing:border-box}body{margin:0 auto;max-width:1080px;padding:24px;background:#f4f7f4;color:#183b32;font:16px/1.6 system-ui}section{background:white;padding:24px;margin:18px 0;border:1px solid #dce5df;border-radius:14px}.banner{background:#fff3d6;border:2px solid #c78a23;padding:18px;font-weight:600}nav{display:flex;flex-wrap:wrap;gap:8px}a,button{font:inherit}nav a,button,.action{display:inline-block;background:#22624d;color:white;border:0;padding:10px 14px;border-radius:8px;text-decoration:none}p,code,pre,li{overflow-wrap:anywhere}pre{white-space:pre-wrap}.badge{display:inline-block;background:#eef5ee;padding:6px 10px;border-radius:6px}article{padding:12px;border-top:1px solid #dce5df}.unknown{color:#775514}details{padding:12px;border:1px solid #dce5df;border-radius:8px}@media(max-width:600px){body{padding:14px}section{padding:16px}nav a{width:100%}}</style>
<h1>从诉求到回执的本地评审路径</h1><p class="banner" id="boundary">这是评审目录，不是同一新事项的完整办理链。真实产品代码使用合成资料验证的历史证据，与可操作的独立 Mock 候选分开展示；Mock 发布或访问结果不写入正式状态。真实业务权限与履约未启用。</p>
<section><p id="mode" class="badge"></p><p>不连接产品 PostgreSQL，不创建账号或凭据，不改 Grant、assignment 或 owner；资格未知、目标未完成。每段有独立来源与 Case/Run 标识，不能拼成同一事项已办结。</p><nav id="steps" aria-label="评审步骤"></nav><button id="refresh">刷新只读证据目录</button><p id="error" role="alert"></p></section>
<main id="stages"></main>
<section id="gaps"><h2>原计划尚缺项</h2><div id="gap-list"></div><p>F1未签收，F2并行探索；Windows Server不是Win11，Linux或Mock通过不代表原生完整验收。R4关闭、模型调用和预算0。</p></section>
<script>
const $=id=>document.getElementById(id);let generation=0,review=null;
function text(tag,s){const n=document.createElement(tag);n.textContent=s;return n;}
const scopeLabels={PRODUCT_CODE_HISTORICAL_SYNTHETIC_EVIDENCE:'产品代码的合成历史验证证据 · 本次只读',ISOLATED_MOCK_HISTORICAL_EVIDENCE:'独立 Mock 的历史验证证据 · 不代表正式状态'};
const states={VERIFIED_COMMITTED_EVIDENCE:'提交证据文件哈希一致',SOURCE_CHANGED_REVALIDATION_REQUIRED:'来源文件已变化，须重新验证；本段不作通过依据',UNAVAILABLE:'来源缺失或不可读，本段证据未知'};
function render(x){review=x;$('mode').textContent=x.isolated_mock_enabled?'本次仅开启隔离合成 Mock；真实权限仍关闭':'默认关闭；候选页面不建存储，所有读写拒绝';$('steps').replaceChildren();$('stages').replaceChildren();for(const s of x.stages){const a=text('a',s.title);a.href='#'+s.id;$('steps').append(a);const section=document.createElement('section');section.id=s.id;section.append(text('h2',s.title),text('p',scopeLabels[s.kind]),text('p',states[s.state]),text('p','历史 Case：'+s.case_id+' · 历史 Run：'+s.run_id+' · 当前产品状态未读取'));if(s.id==='request')section.append(text('p','原诉求及必需目标有持久保存/覆盖验证；本页不展示所属经办人的私有原文，不提交新诉求。'));if(s.id==='plan')section.append(text('p','当前只支持有限四步方案；未知或未覆盖目标阻止启用。不生成完整目录/DAG或自动办理。'));if(s.id==='readiness')section.append(text('p','缺证据未知、明确补正不满足；当前人工核对只验证本地材料条件。变化后旧评估过期，资格仍未知。'));for(const c of s.checks)section.append(text('article',c.label+'：'+(c.observed===true?'该历史测试已验证':c.observed===false?'该历史测试观察为否':'未记录，保持未知')));const detail=document.createElement('details');detail.append(text('summary','查看本段来源与文件校验'),text('p',s.source),text('p','SHA256：'+(s.actual_sha256||'不可读取')),text('p','这是提交的JSON验证摘要；历史截图是本地运行产物，本页不读取运行目录或私有文件。'));section.append(detail);if(s.id==='rules'||s.id==='access'){section.append(text('p','下方打开的是新的独立合成场景，park-a/org-a，与上面的历史Case无业务关联；真实发布、实际Run访问仍关闭。'));const link=text('a',s.id==='rules'?'打开独立 Mock 规则审核发布':'打开独立 Mock 单 Run 访问申请');link.id='open-'+s.id;link.className='action';link.href=x.candidate_links[s.id];section.append(link,text('p','完成后用浏览器返回此评审入口。重复打开/刷新保留候选审计，不自动审批；这些结果不会推进上面历史Case。'));}if(s.id==='receipt')section.append(text('p','这是另一份既有合法预置assignment下的历史合成协作证据。本人接受和本地回执不是外部履约；当前新Run冷入口仍阻塞，目标未完成。'));$('stages').append(section);}$('gap-list').replaceChildren(...x.original_plan_gaps.map(g=>text('article',g.id+' · '+g.gap)));$('error').textContent='';}
async function load(){const g=++generation;try{const r=await fetch('/api/review/path');if(!r.ok)throw Error('只读评审目录暂不可用');const x=await r.json();if(g!==generation)return;render(x);}catch(e){if(g===generation){review=null;$('stages').replaceChildren();$('steps').replaceChildren();$('error').textContent=e.message;}}}
$('refresh').onclick=load;load();
</script></html>
