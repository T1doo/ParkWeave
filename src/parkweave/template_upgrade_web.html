<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐事项模板版本检查</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui;max-width:860px;margin:auto;padding:20px;color:#183b32;background:#f3f6f3}section{background:white;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea{width:100%;padding:10px;font:inherit}button{font:inherit;min-height:44px;padding:10px;margin:6px;border:0;border-radius:6px;background:#22624d;color:white}button:disabled{opacity:.4}pre,p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:600px){body,section{padding:12px}}</style>
<h1>逐事项模板版本检查</h1><p>检查新旧模板与本事项当前状态。选择只记录保留或后续人工重验意向，原事项、预约、回执和旧版绑定保持。正式发布与迁移未启用。</p>
<section><label>当前企业访问令牌<input id="token" type="password" autocomplete="off"></label><label>原模板实例 ID<input id="instance"></label><button id="catalog">读取当前候选版本</button><label>目标版本<select id="target"></select></label><button id="check" disabled>检查此事项版本</button><p id="result" aria-live="polite"></p><label>本次选择说明<textarea id="reason"></textarea></label><button data-choice="KEEP_CURRENT" disabled>保留旧版</button><button data-choice="REQUEST_RECHECK" disabled>记录人工重验意向</button><button data-choice="ACK_COMPATIBLE" disabled>确认兼容检查</button><p id="error" role="alert"></p><pre id="receipt"></pre><label>原选择请求键<input id="key"></label><button id="recover">只读核对原选择</button><a href="/template">原模板入口</a></section>
<script>
const $=id=>document.getElementById(id);let generation=0,inspection=null,pending=null,busy=false;
function context(){return {generation,token:$('token').value,instance:$('instance').value,target:$('target').value};}
function current(c){return JSON.stringify(c)===JSON.stringify(context());}
function buttons(){const blocked=busy||!!pending;$('catalog').disabled=blocked;$('check').disabled=blocked||!$('target').value||!$('instance').value;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=blocked||!inspection?.check.allowed_choices.includes(b.dataset.choice));$('reason').disabled=blocked;$('recover').disabled=busy;$('key').disabled=busy||!!pending;}
function clear(dropCatalog=false){generation++;inspection=null;pending=null;busy=false;for(const id of ['result','error','receipt'])$(id).textContent='';$('key').value='';$('reason').value='';if(dropCatalog)$('target').replaceChildren();buttons();}
async function call(c,url,method='GET',body,key){let r,x;try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json',...(key?{'Idempotency-Key':key}:{})},body:body?JSON.stringify(body):undefined});x=await r.json();}catch(e){if(!current(c))throw Error('STALE');e.unknown=method==='POST';throw e;}if(!current(c))throw Error('STALE');if(!r.ok){const e=Error(r.status===403?'当前身份或范围无权访问':r.status===409?'版本、来源或选择记录已变化，请重新检查':r.status===422?'输入不符合检查合同':'请求未完成');e.unknown=method==='POST'&&r.status>=500;e.denied=r.status===403;throw e;}return x;}
function fail(c,e){if(e.message==='STALE'||!current(c))return;if(e.denied)clear(true);$('error').textContent=e.unknown?'结果未知，请保留原请求键并只读核对；未观察到记录不等于原请求不会迟到。':e.message;}
function url(c){return '/api/template-upgrade/'+encodeURIComponent(c.instance);}
$('token').oninput=()=>clear(true);$('instance').oninput=()=>clear(true);$('target').onchange=()=>clear();
$('catalog').onclick=async()=>{const c=context();busy=true;buttons();try{const x=await call(c,'/api/template-consumer/catalog');$('target').replaceChildren();for(const t of x.templates){const o=document.createElement('option');o.textContent=t.name+' · '+t.release_id;o.value=t.release_id;o.dataset.hash=t.release_sha256;$('target').append(o);}generation++;inspection=null;busy=false;buttons();}catch(e){fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
$('check').onclick=async()=>{const c=context(),o=$('target').selectedOptions[0];busy=true;buttons();try{inspection=await call(c,url(c)+'/check?'+new URLSearchParams({target_release_id:o.value,target_sha256:o.dataset.hash}));const names={COMPATIBLE:'兼容；原待办理步骤仍未完成',NEEDS_RECHECK:'需人工重验',LOCK_CONFLICT:'人工锁冲突；请在原入口处理',BREAKING_REJECTED:'破坏性升级拒绝'};$('result').textContent=names[inspection.check.classification]+' · 内容版本 '+inspection.check.original_content_version+' → '+inspection.check.target_content_version+' · 来源版本 '+inspection.check.original_source_revision+' → '+inspection.check.target_source_revision+'\n'+inspection.check.changes.join('、');$('receipt').textContent='旧版 '+inspection.check.original_release_id+'\n目标 '+inspection.check.target_release_id+'\n历史选择 '+inspection.revision; $('error').textContent='';}catch(e){if(current(c))inspection=null;fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
async function choose(choice){const c=context();if(busy)return;if(!inspection||pending)return;pending={url:url(c)+'/choices',key:crypto.randomUUID(),body:{target_release_id:inspection.check.target_release_id,expected_target_sha256:inspection.check.target_release_sha256,expected_check_sha256:inspection.check_sha256,expected_revision:inspection.revision,choice,reason:$('reason').value}};$('key').value=pending.key;if(!pending)return;busy=true;buttons();try{const x=await call(c,pending.url,'POST',pending.body,pending.key);pending=null;inspection=null;$('receipt').textContent='已记录选择；原旧版保持\n'+JSON.stringify(x.event);$('error').textContent='';}catch(e){if(current(c)){if(!e.unknown){pending=null;inspection=null;}fail(c,e);}}finally{if(current(c)){busy=false;buttons();}}}
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));
$('recover').onclick=async()=>{const c=context();if(busy)return;busy=true;buttons();try{const x=await call(c,url(c)+'/requests/'+encodeURIComponent($('key').value));$('receipt').textContent=x.status+' · 历史选择，只读\n'+JSON.stringify(x.event);if(x.event){pending=null;inspection=null;buttons();}}catch(e){fail(c,e);}finally{if(current(c)){busy=false;buttons();}}};
buttons();
</script></html>
