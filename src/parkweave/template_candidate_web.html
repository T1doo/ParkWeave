<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数化模板 · 隔离候选</title>
<style>*{box-sizing:border-box}body{max-width:1040px;margin:auto;padding:24px;background:#f3f6f3;color:#183b32;font:16px/1.6 system-ui}section{background:white;border:1px solid #dce5df;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;padding:10px;font:inherit;border:1px solid #bbc8bf;border-radius:6px}textarea{min-height:90px}input[type=checkbox]{display:inline;width:auto}button{font:inherit;padding:10px 14px;margin:5px 5px 5px 0;border:0;border-radius:7px;color:white;background:#22624d;max-width:100%}button:disabled{opacity:.4}p,article,pre,a{overflow-wrap:anywhere}pre{white-space:pre-wrap}article{border-top:1px solid #dce5df;padding:12px 0}.banner{padding:18px;background:#fff3d6;border:2px solid #c78a23}[hidden]{display:none!important}@media(max-width:600px){body{padding:12px}section{padding:14px}}</style>
<h1>参数化模板审核与新事项</h1><p class="banner" id="banner">隔离候选默认关闭。候选审核与发布不代表正式业务发布或企业资格确认。</p>
<section><h2>模板来源与候选审核</h2><label>隔离合同主体<select id="template-actor"></select></label><label>园区<input id="template-park" value="park-a"></label><label>模板标识<input id="template-id" value="template-materials"></label><button id="template-refresh">读取当前模板</button><p id="template-status" aria-live="polite"></p><p id="template-error" role="alert"></p>
<div id="template-editor"><label>模板名称<input id="template-name" value="SYNTHETIC 新企业材料准备模板"></label><fieldset><legend>本模板明确要求的本地目标</legend><p>请选择已有能力。每次新事项仍须独立核对资料、批准资源、本人接单与实际产物。</p><div id="template-goals"></div></fieldset><label>来源版本<input id="template-source-revision" value="1"></label><label>合成来源说明<textarea id="template-source-statement">SYNTHETIC：每次使用须重新提交当前企业材料并由获派专员人工核对。</textarea></label></div>
<label>本次操作说明<textarea id="template-reason">SYNTHETIC 明确候选操作；正式发布仍未启用。</textarea></label><div id="template-actions"><button data-template-action="SAVE_DRAFT">保存草稿</button><button data-template-action="SUBMIT">提交候选审核</button><button data-template-action="RETURN_DRAFT">返回草稿</button><button data-template-action="REVIEW">确认候选审核</button><button data-template-action="REJECT">要求修订</button><button data-template-action="CANDIDATE_PUBLISH">生成候选发布快照</button><button data-template-action="WITHDRAW">撤回候选发布</button></div><button id="template-retry" hidden>以原请求重试未知结果</button><div id="template-history"></div></section>
<section><h2>当前企业新建事项</h2><p>模板只提供步骤和参数结构。每次填写新诉求与新材料；审核、确认和办理继续使用原事项入口。</p><label>当前企业访问令牌<input id="consumer-token" type="password" autocomplete="off"></label><button id="consumer-catalog">读取当前可用模板与获派专员</button><p id="consumer-scope"></p><label>当前候选发布版本<select id="consumer-release"></select></label><label>当前企业获派专员<select id="consumer-reviewer"></select></label><label>新事项诉求<textarea id="consumer-goal"></textarea></label><label>本次诉求摘要<textarea id="consumer-need-summary"></textarea></label><label>摘要来源说明<input id="consumer-need-source"></label><label>本次材料目录<textarea id="consumer-material-outline"></textarea></label><label>目录来源说明<input id="consumer-outline-source"></label><fieldset><legend>本次明确要求的本地目标</legend><p>模板及已保存必需目标不可删除；LOCAL 规则评估不代表模型理解。</p><div id="consumer-goals"></div></fieldset><fieldset><legend>本次规划约束</legend><label><input id="consumer-exclude-owner" type="checkbox">不安排企业操作员</label><label><input id="consumer-exclude-specialist" type="checkbox">不安排园区专员</label><label><input id="consumer-exclude-executor" type="checkbox">不安排执行者</label><label>合同外附加必需条件（每行一项，保留为不支持项）<textarea id="consumer-additional"></textarea></label></fieldset><button id="consumer-create" disabled>使用模板创建新事项</button><button id="consumer-retry" hidden>以原请求重试未知结果</button><p id="consumer-status" aria-live="polite"></p><p id="consumer-error" role="alert"></p><div id="consumer-result"></div><label>读取已创建实例<input id="consumer-instance-id"></label><button id="consumer-read">读取当前实例</button><button id="consumer-resume" disabled>继续原实例准备</button><button id="consumer-reconcile" disabled>核对旧采纳的原请求结果</button><button id="consumer-preview" disabled>读取当前需求与规则预览</button><button id="consumer-edit" disabled>返回修改本次需求与约束</button><button id="consumer-save-request" disabled>保存修改后的本次需求</button><div id="consumer-planning"></div><button id="consumer-confirm" disabled>核对当前来源并进入明确确认</button><label>明确采纳原因<input id="consumer-plan-reason" maxlength="1000"></label><label id="consumer-partial-label" hidden><input id="consumer-partial-confirm" type="checkbox">我明确只采纳所列独立部分，全部必需目标保留，整体PARTIAL；其余转人工，依赖阻塞步骤不可办理</label><button id="consumer-adopt" disabled>明确采纳当前方案</button><button id="consumer-adoption-recover" disabled>只读核对此次原采纳结果</button><div id="consumer-adoption-handles"></div><label>明确收尾原因<input id="consumer-finalize-reason" maxlength="1000"></label><button id="consumer-adoption-finalize" disabled>明确收尾原键并清理本条句柄</button><a id="product-link" hidden>进入原资料审核与步骤入口</a></section>
<script>
const $=id=>document.getElementById(id);let status=null,view=null,catalog=null,instance=null;let tg=0,cg=0,tp=null,cp=null;let planningView=null,confirmed=null,pg=0,consumerDirty=false;let adoptionHandle=null,adoptionRecovering=false,adoptionVerified=null,adoptionFinalizeUnknown=false;
const planningFields=["consumer-exclude-owner","consumer-exclude-specialist","consumer-exclude-executor","consumer-additional","consumer-plan-reason","consumer-partial-confirm"];
function node(tag,value){const n=document.createElement(tag);n.textContent=value;return n;}
function context(channel){return channel==='template'?{g:tg,actor:$('template-actor').value,park:$('template-park').value,id:$('template-id').value}:{g:cg,token:$('consumer-token').value};}
function current(channel,c){const a=context(channel);return JSON.stringify(a)===JSON.stringify(c);}
function path(c){return '/api/template-candidate/'+encodeURIComponent(c.park)+'/'+encodeURIComponent(c.id);}
function clearTemplate(){tg++;view=null;tp=null;$('template-history').replaceChildren();$('template-status').textContent='';$('template-error').textContent='';$('template-retry').hidden=true;for(const id of ['template-name','template-source-revision','template-source-statement','template-reason'])$(id).value='';renderGoals([]);buttons();}
function clearConsumer(){adoptionHandle=null;adoptionRecovering=false;adoptionVerified=null;adoptionFinalizeUnknown=false;$('consumer-finalize-reason').value='';clearProductLink();cg++;clearPlanning();catalog=null;instance=null;cp=null;$('consumer-result').replaceChildren();$('consumer-release').replaceChildren();$('consumer-reviewer').replaceChildren();$('consumer-scope').textContent='';$('consumer-status').textContent='';$('consumer-error').textContent='';$('consumer-instance-id').value='';$('consumer-retry').hidden=true;for(const id of ['consumer-goal','consumer-need-summary','consumer-material-outline','consumer-need-source','consumer-outline-source'])$(id).value='';for(const id of planningFields){$(id).value='';$(id).checked=false;}$('consumer-goals').replaceChildren();buttons();}
function confirmationMode(x){if(!x||x.plan_id||x.service_case_plan?.plan_id)return null;if(x.current?.state==='COVERED_PREVIEW_ONLY'&&x.service_case_plan?.can_adopt===true)return 'FULL';if(x.current?.state==='PARTIAL'&&x.current.partial_offer?.can_adopt===true&&x.service_case_plan?.can_adopt_partial===true)return 'PARTIAL';return null;}
const adoptionStorage='parkweave.template-adoption-recovery.v1.';const adoptionLocations=new WeakMap();
const adoptionFields=['actor','case','instance','key','partial','preparation','preparationRevision','requestRevision','run','source','v'];
const adoptionUuid=x=>typeof x==='string'&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(x);
function adoptionName(x){return adoptionLocations.get(x)||adoptionStorage+x.actor+'.'+x.instance+'.'+x.key;}
function readAdoptionHandle(x,preferredName=null){if(!x||!/^[a-f0-9]{64}$/.test(x.actor_ref||'')||!adoptionUuid(x.instance_id))return null;try{const base=adoptionStorage+x.actor_ref+'.'+x.instance_id,names=Object.keys(localStorage).filter(n=>n===base||n.startsWith(base+'.')).sort();if(preferredName&&!names.includes(preferredName))throw Error('missing selected handle');if(!names.length)return null;const name=preferredName||names[0],raw=localStorage.getItem(name);if(raw===null)return null;const h=JSON.parse(raw);if(raw.length>720||!h||Object.keys(h).filter(k=>k!=='finishPending').sort().join(',')!==adoptionFields.join(',')||('finishPending' in h&&h.finishPending!==true)||h.v!==1||h.actor!==x.actor_ref||h.instance!==x.instance_id||![h.instance,h.case,h.run,h.preparation,h.key].every(adoptionUuid)||h.case!==x.case_id||h.run!==x.run_id||h.preparation!==x.preparation_id||!/^[a-f0-9]{64}$/.test(h.source)||typeof h.partial!=='boolean'||!Number.isSafeInteger(h.preparationRevision)||h.preparationRevision<1||h.preparationRevision>64||!Number.isSafeInteger(h.requestRevision)||h.requestRevision<1||h.requestRevision>64)throw Error('invalid');if(name!==base&&name!==base+'.'+h.key)throw Error('invalid name');adoptionLocations.set(h,name);return h;}catch(e){return {invalid:true,actor:x.actor_ref,instance:x.instance_id};}}
function rememberAdoptionHandle(x,preview,pending){const h={v:1,actor:x.actor_ref,instance:x.instance_id,case:x.case_id,run:x.run_id,preparation:x.preparation_id,key:pending.key,source:pending.body.expected_source_sha256,preparationRevision:pending.body.expected_preparation_revision,requestRevision:pending.body.expected_request_revision,partial:pending.body.partial_adoption===true};if(preview.actor_ref!==h.actor)throw Error('本次主体无法核对');try{if(Object.keys(localStorage).filter(k=>k.startsWith(adoptionStorage)).length>=8)throw Error('capacity');const raw=JSON.stringify(h);localStorage.setItem(adoptionName(h),raw);if(localStorage.getItem(adoptionName(h))!==raw||readAdoptionHandle(x)?.key!==h.key)throw Error('storage');return h;}catch(e){throw Error('无法保存有界原采纳句柄；操作尚未发送，不生成新的请求替代。');}}
function sameStoredAdoption(h){try{return JSON.stringify(JSON.parse(localStorage.getItem(adoptionName(h))))===JSON.stringify(h);}catch(e){return false;}}
function exactAdoptionProof(x,h,id){
 const r=x.receipt,q=x.original_request,y=x.instance;
 if(x.instance_id!==id||x.actor_ref!==h.actor||x.consumer_request_key!==h.key||x.automatically_replayed!==false||x.product_read_only!==true||x.journal_read_only!==true||x.case_goal_completed!==false||!r||r.actor_ref!==h.actor||r.preparation_id!==h.preparation||r.case_id!==h.case||r.run_id!==h.run||!q||q.expected_source_sha256!==h.source||q.expected_preparation_revision!==h.preparationRevision||q.expected_request_revision!==h.requestRevision||q.partial_adoption!==h.partial||!y||y.instance_id!==id||y.actor_ref!==h.actor||y.preparation_id!==h.preparation||y.case_id!==h.case||y.run_id!==h.run||!['COMMITTED','NOT_OBSERVED','NOT_COMMITTED_STALE','REFUSED','REFUSED_FIRST_SEND','NOT_COMMITTED_FINAL'].includes(x.status)||typeof x.journal_terminal!=='boolean'||typeof x.finalizable!=='boolean'||!/^[a-f0-9]{64}$/.test(x.body_sha256))throw Error('原采纳请求与当前事项证明无法核对，保持未决');
 if(x.status==='COMMITTED'&&(r.status!=='COMMITTED'||r.event?.action!=='ADOPT'||r.event.request_key!==x.original_request_key||!adoptionUuid(r.event.plan_id)||(r.event.current_plan&&y.plan_id!==r.event.plan_id)))throw Error('原采纳事件不能核对');
 if(x.journal_terminal){const f=x.finalization;
  if(!f||f.original_request_key!==x.original_request_key||f.body_sha256!==x.body_sha256||f.state!==x.journal_state||!/^[a-f0-9]{64}$/.test(f.fingerprint)||f.request?.expected_original_request_key!==x.original_request_key||f.request.expected_body_sha256!==x.body_sha256||!(x.status==='COMMITTED'&&x.journal_state==='CONFIRMED'&&f.proof_kind==='COMMITTED'||x.status==='NOT_COMMITTED_FINAL'&&r.status==='NOT_OBSERVED'&&x.journal_state==='CLOSED_NOT_COMMITTED'&&r.not_committed_final===true&&f.proof_kind==='STRICTLY_ADVANCED_SOURCE'))throw Error('服务端原键终态无法核对，不清理句柄');
 }
}
async function recoverConsumerAdoption(){
 if(adoptionRecovering||cp?.state==='SUBMITTING'||!instance||!adoptionHandle)return;
 const h=adoptionHandle,c=context('consumer'),generation=pg,id=instance.instance_id;
 if(h.invalid){$('consumer-error').textContent='原采纳句柄损坏或缺失，保持未决；请保存原请求键核对，不重新采纳。';return;}
 adoptionRecovering=true;adoptionVerified=null;buttons();
 try{const x=await call('consumer','/api/template-consumer/instances/'+encodeURIComponent(id)+'/planning-recovery','GET',undefined,h.key,c);
  if(!current('consumer',c)||generation!==pg||instance?.instance_id!==id||adoptionHandle!==h)return;
  exactAdoptionProof(x,h,id);
  if(x.journal_terminal){
   if(!sameStoredAdoption(h))throw Error('本条磁盘句柄已变化，不清理其他原键');localStorage.removeItem(adoptionName(h));if(localStorage.getItem(adoptionName(h))!==null)throw Error('服务端终态已核实，但本条句柄未清理成功，请只读重查');
   cp=null;adoptionHandle=null;adoptionVerified=null;adoptionFinalizeUnknown=false;$('consumer-retry').hidden=true;renderInstance(x.instance);
   $('consumer-status').textContent='原键服务端终态已核实，仅清理本条句柄；旧键不能重新采纳。'+(x.status==='COMMITTED'?'原目标完成仍须逐项核验。':'原请求已永久不提交，可从当前来源明确重新准备。');
  }else if(x.status==='COMMITTED'){
   cp=null;renderInstance(x.instance,x.original_request_key);adoptionHandle=h;adoptionVerified=x;adoptionFinalizeUnknown=!!h.finishPending;$('consumer-retry').hidden=true;
   $('consumer-status').textContent='原采纳事件已核实；句柄仍保留。明确收尾并取得服务端终态后才清理本条。整体目标完成仍未验证。';
  }else{adoptionVerified=x;adoptionFinalizeUnknown=!!h.finishPending;
   $('consumer-status').textContent=x.finalizable?'原请求已有永久不提交证明；请填写原因明确收尾，服务端确认终态后才清理本条。':'原采纳 '+x.status+'；首次拒绝也不能证明永久不提交，原键与句柄保持未决，不解锁、不自动重新采纳。';
  }
  $('consumer-error').textContent='';
 }catch(e){if(!current('consumer',c)||generation!==pg||instance?.instance_id!==id)return;fail('consumer',e,c);}
 finally{if(current('consumer',c)&&instance?.instance_id===id){adoptionRecovering=false;buttons();}}
}
async function finalizeConsumerAdoption(){
 if(adoptionRecovering||adoptionFinalizeUnknown||!instance||!adoptionHandle||adoptionHandle.invalid||!adoptionVerified?.finalizable)return;
 const original=adoptionHandle,x=adoptionVerified,c=context('consumer'),id=instance.instance_id,generation=pg;
 const data={expected_body_sha256:x.body_sha256,expected_original_request_key:x.original_request_key,expected_journal_state:x.journal_state,reason:$('consumer-finalize-reason').value.trim()};
 if(!data.reason){$('consumer-error').textContent='请填写本次原键明确收尾原因';return;}
 try{if(!sameStoredAdoption(original))throw Error('changed');const saved={...original,finishPending:true},raw=JSON.stringify(saved);adoptionLocations.set(saved,adoptionName(original));localStorage.setItem(adoptionName(saved),raw);if(localStorage.getItem(adoptionName(saved))!==raw)throw Error('storage');adoptionHandle=saved;}
 catch(e){$('consumer-error').textContent='无法保存收尾未决标记，尚未发送；不清理原句柄';return;}
 adoptionRecovering=true;adoptionFinalizeUnknown=true;adoptionVerified=null;buttons();
 try{await call('consumer','/api/template-consumer/instances/'+encodeURIComponent(id)+'/planning-finalization','POST',data,original.key,c);
  if(!current('consumer',c)||generation!==pg||instance?.instance_id!==id)return;
  adoptionRecovering=false;await recoverConsumerAdoption();
 }catch(e){if(!current('consumer',c)||generation!==pg||instance?.instance_id!==id)return;fail('consumer',e,c);$('consumer-status').textContent='原键收尾结果未核实；保留本条句柄，只GET原key重查，不重复收尾或重新采纳。';}
 finally{if(current('consumer',c)&&instance?.instance_id===id){adoptionRecovering=false;buttons();}}
}

function renderAdoptionHandles(){
 const box=$('consumer-adoption-handles');box.replaceChildren();const actor=catalog?.actor_ref||instance?.actor_ref;
 if(!/^[a-f0-9]{64}$/.test(actor||''))return;
 try{for(const name of Object.keys(localStorage).filter(n=>n.startsWith(adoptionStorage+actor+'.')).sort()){
  const h=JSON.parse(localStorage.getItem(name));if(h.actor!==actor||!adoptionUuid(h.instance)||!adoptionUuid(h.key))continue;
  const b=node('button','逐个核对原事项 '+h.instance+' · 原键 '+h.key);b.disabled=!!cp||adoptionRecovering;
  b.onclick=async()=>{if(cp||adoptionRecovering)return;$('consumer-instance-id').value=h.instance;await $('consumer-read').onclick(name);};box.append(b);
 }}catch(e){box.append(node('p','恢复记录存在损坏；保持原记录，不批量删除。'));}
}
function buttons(){if(cp||(adoptionHandle&&!adoptionVerified))clearProductLink();if(cp?.state==='UNKNOWN'&&cp.action!=='CONFIRM_PLAN')$('consumer-status').textContent='结果未知；请保存原请求键 '+cp.key+'，仅可明确按原键和原参数重试。有权历史读取不代表此请求完成。';for(const id of ['template-name','template-source-revision','template-source-statement','template-reason'])$(id).disabled=!!tp;document.querySelectorAll('[data-template-goal]').forEach(b=>b.disabled=!!tp);for(const id of ['consumer-release','consumer-reviewer','consumer-goal','consumer-need-summary','consumer-material-outline','consumer-need-source','consumer-outline-source',...planningFields])$(id).disabled=!!cp||!!adoptionHandle||adoptionRecovering;document.querySelectorAll('[data-consumer-goal]').forEach(b=>b.disabled=!!cp||!!adoptionHandle||adoptionRecovering||b.dataset.mandatory==='true');document.querySelectorAll('[data-template-action]').forEach(b=>b.disabled=!view||!!tp);$('consumer-create').disabled=!catalog||!$('consumer-release').value||!!cp||!!adoptionHandle;$('consumer-resume').disabled=!instance||instance.state==='PLAN_ADOPTED'||instance.release_available===false||!!cp||!!adoptionHandle;$('consumer-reconcile').disabled=!!cp||!instance?.stages?.some(s=>s.name==='ADOPT_PLAN'&&['STARTED','UNKNOWN','REFUSED'].includes(s.state));const ready=!!instance?.preparation_id&&!instance.plan_id&&!cp&&!adoptionHandle;for(const id of ['consumer-preview','consumer-edit'])$(id).disabled=!ready;$('consumer-save-request').disabled=!ready||!planningView||!consumerDirty;$('consumer-confirm').disabled=!ready||consumerDirty||!confirmationMode(planningView);$('consumer-adopt').disabled=!ready||consumerDirty||!confirmed||(confirmationMode(confirmed)==='PARTIAL'&&!$('consumer-partial-confirm').checked);$('consumer-adoption-recover').disabled=!adoptionHandle||adoptionRecovering||cp?.state==='SUBMITTING';$('consumer-adoption-finalize').disabled=!adoptionHandle||adoptionHandle.invalid||adoptionRecovering||adoptionFinalizeUnknown||!adoptionVerified?.finalizable;$('consumer-finalize-reason').disabled=!adoptionHandle||adoptionRecovering||adoptionFinalizeUnknown;renderAdoptionHandles();}
async function call(channel,url,method='GET',body,key,c=context(channel)){let r,x;try{r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(channel==='template'?{'X-Isolated-Template-Actor':c.actor}:{Authorization:'Bearer '+c.token}),...(key?{'Idempotency-Key':key}:{})},body:body===undefined?undefined:JSON.stringify(body)});}catch(e){if(!current(channel,c))throw Error('STALE');e.unknown=method==='POST';throw e;}if(!current(channel,c))throw Error('STALE');if(r.status===403){const e=Error('当前主体或范围无权访问，请重新核对身份');e.code=403;throw e;}try{x=await r.json();}catch(e){if(!current(channel,c))throw Error('STALE');e.unknown=method==='POST';throw e;}if(!current(channel,c))throw Error('STALE');if(!r.ok){const e=Error(r.status===403?'当前主体或范围无权访问，请重新核对身份':r.status===409?'版本、来源或授权已变化，请读取当前状态':r.status===422?'输入不符合当前模板合同':String(x.detail||'请求未完成'));e.code=r.status;e.unknown=method==='POST'&&r.status>=500;throw e;}return x;}
function fail(channel,e,c){if(e.message==='STALE'||!current(channel,c))return;if(channel==='consumer')clearProductLink();$(channel==='template'?'template-error':'consumer-error').textContent=e.unknown?(cp?.action==='CONFIRM_PLAN'||adoptionHandle?'采纳结果未知；保留原 key，只读核对，不能再次发送采纳。':'结果未知，请保留当前身份并以原请求重试。'):e.message;if(e.code===403){if(channel==='template')clearTemplate();else clearConsumer();$(channel==='template'?'template-error':'consumer-error').textContent=e.message;}buttons();}
const goalLabels={LOCAL_MATERIAL_PREPARATION:'当前材料准备',LOCAL_CASE_RESOURCE_ASSOCIATION:'当前Case合成资源交付',LOCAL_INTERNAL_ACCEPTANCE:'执行者本人接单',LOCAL_SYNTHETIC_RECEIPT_ACKNOWLEDGEMENT:'企业核对当前合成回执',LOCAL_SYNTHETIC_COORDINATION_RECORDS:'当前合成本地协作记录',LOCAL_CASE_RECORD_RECHECK:'当前Case本地记录重验',SYNTHETIC_EXTERNAL_AUTHORITY_APPROVAL:'机构审批与正式受理（目录无能力，待人工/新服务）'};
function renderGoals(selected){const box=$('template-goals');box.replaceChildren();for(const goal of status?.registered_goals||[]){const label=node('label',goalLabels[goal]||goal),input=document.createElement('input');input.type='checkbox';input.dataset.templateGoal=goal;input.checked=selected.includes(goal);input.style.width='auto';input.style.display='inline';label.prepend(input);box.append(label);}}
function renderTemplate(x){view=x;$('template-status').textContent=x.state+' · 操作版本 '+x.revision+' · 内容版本 '+x.content_version+' · 当前可用 '+Boolean(x.candidate_available)+' · 正式业务发布未启用';const h=$('template-history');h.replaceChildren();const d=x.draft||status?.example_definition;renderGoals(d?.required_goals||[]);if(d){$('template-name').value=d.name;$('template-source-revision').value=d.source.revision;$('template-source-statement').value=d.source.statement;}if(x.draft){h.append(node('p','定义 SHA256：'+x.definition_sha256),node('p','必需目标：'+x.draft.required_goals.join('、')));}for(const e of x.history||[])h.append(node('article',JSON.stringify(e)));for(const r of x.releases||[])h.append(node('article','候选快照 '+r.release_id+' · '+r.state+' · '+r.release_sha256));buttons();}
async function loadTemplate(c=context('template')){try{renderTemplate(await call('template',path(c),'GET',undefined,undefined,c));}catch(e){fail('template',e,c);}}
function draft(){if(!status?.example_definition||!status?.goal_adapters||!Array.isArray(status.registered_steps))throw Error('缺少显式模板参数合同');const goals=[...document.querySelectorAll('[data-template-goal]:checked')].map(x=>x.dataset.templateGoal);if(!goals.length)throw Error('请明确选择至少一个已有本地目标');const required=new Set(),registry=new Map(status.registered_steps.map(s=>[s.id,s]));function need(id,visiting=new Set()){if(required.has(id))return;if(!registry.has(id)||visiting.has(id))throw Error('注册目标依赖不能核对');const next=new Set(visiting);next.add(id);for(const dependency of registry.get(id).depends_on)need(dependency,next);required.add(id);}for(const goal of goals)need(status.goal_adapters[goal]);const d=structuredClone(view?.draft||status.example_definition);d.required_goals=goals;d.steps=status.registered_steps.filter(s=>required.has(s.id)).map(s=>structuredClone(s));d.name=$('template-name').value;d.source.revision=$('template-source-revision').value;d.source.statement=$('template-source-statement').value;return d;}
async function writeTemplate(action,retry=false){const c=context('template');try{if(!retry){if(tp||!view)return;const body={action,expected_revision:view.revision,expected_definition_sha256:view.definition_sha256,reason:$('template-reason').value};if(action==='SAVE_DRAFT')body.draft=draft();if(action==='CANDIDATE_PUBLISH')body.validity=view.draft.source.validity;tp={url:path(c)+'/commands',body,key:crypto.randomUUID(),state:'SUBMITTING'};}else if(!tp||tp.state!=='UNKNOWN')return;tp.state='SUBMITTING';buttons();await call('template',tp.url,'POST',tp.body,tp.key,c);tp=null;$('template-retry').hidden=true;await loadTemplate(c);}catch(e){if(current('template',c)&&tp){if(e.unknown){tp.state='UNKNOWN';$('template-retry').hidden=false;}else tp=null;}fail('template',e,c);}buttons();}
function clearProductLink(){$('product-link').hidden=true;$('product-link').removeAttribute('href');}
function renderInstance(x,verifiedOriginalKey=null,preferredName=null){adoptionVerified=null;adoptionFinalizeUnknown=false;$('consumer-finalize-reason').value='';clearProductLink();clearPlanning();instance=x;adoptionHandle=verifiedOriginalKey?null:readAdoptionHandle(x,preferredName);if(!adoptionHandle&&x.stages?.some(s=>s.request_key!==verifiedOriginalKey&&s.name.startsWith('CONFIRM_PLAN_')&&['ADMITTED','STARTED','UNKNOWN','REJECTED_FIRST_SEND'].includes(s.state)))adoptionHandle={invalid:true,actor:x.actor_ref,instance:x.instance_id};adoptionFinalizeUnknown=!!adoptionHandle?.finishPending;if(!cp&&!adoptionHandle&&x.state==='PLAN_ADOPTED'&&[x.instance_id,x.run_id,x.case_id,x.preparation_id,x.plan_id].every(id=>typeof id==='string'&&/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id))){$('product-link').href='/?template_instance='+encodeURIComponent(x.instance_id);$('product-link').hidden=false;}$('consumer-instance-id').value=x.instance_id;$('consumer-status').textContent='实例 '+x.state+' · 候选版本当前可用 '+x.release_available+' · 原目标完成仍未验证';const d=$('consumer-result');d.replaceChildren();for(const [label,key] of [['新 Run','run_id'],['新 Case','case_id'],['资料事项','preparation_id'],['注册步骤计划','plan_id']])d.append(node('p',label+'：'+(x[key]||'尚未生成')));if(x.service_case_plan?.partial_adoption)d.append(node('p','整体 PARTIAL：全部必需目标保留，独立部分可继续，其余待人工/新服务；核验部分不会完成整体诉求。'));if(adoptionHandle)d.append(node('p',adoptionHandle.invalid?'原采纳恢复句柄缺失或损坏；保持未决，不能重发或新建采纳请求。':'原采纳结果待只读核对；原key '+adoptionHandle.key+'，不重发、不新建采纳请求。'));d.append(node('p','不可变候选绑定：'+JSON.stringify(x.binding)));if(x.adoption_reconciliation)d.append(node('p','原采纳请求对账：'+x.adoption_reconciliation.status+' · 仅核原回执，不自动重发采纳。'));if(x.stages?.some(s=>s.name==='ADOPT_PLAN'&&['STARTED','UNKNOWN'].includes(s.state)))d.append(node('p','旧采纳结果未完成对账；未观察到回执不能证明失败。核对前不能新建采纳请求。'));buttons();}
async function loadCatalog(){const c=context('consumer');try{catalog=await call('consumer','/api/template-consumer/catalog','GET',undefined,undefined,c);$('consumer-scope').textContent='当前服务端身份范围 '+catalog.park_id+' / '+catalog.org_id+' · 正式发布未启用';$('consumer-release').replaceChildren();for(const t of catalog.templates||[]){const o=node('option',t.name+' · '+t.release_id);o.value=t.release_id;o.dataset.hash=t.release_sha256;$('consumer-release').append(o);}$('consumer-reviewer').replaceChildren();for(const r of catalog.reviewers||[]){const o=node('option',r.id);o.value=r.id;$('consumer-reviewer').append(o);}$('consumer-error').textContent='';if(!cp)renderConsumerGoals();buttons();}catch(e){fail('consumer',e,c);}}
async function writeConsumer(resume=false,retry=false,reconcile=false){if(retry&&(cp?.action==='CONFIRM_PLAN'||adoptionHandle))return recoverConsumerAdoption();const c=context('consumer');try{if(!retry){if(cp)return;let body,url;if(reconcile){if(!instance)return;url='/api/template-consumer/instances/'+encodeURIComponent(instance.instance_id)+'/adoption-reconciliation';body={};}else if(resume){if(!instance)return;url='/api/template-consumer/instances/'+encodeURIComponent(instance.instance_id)+'/resume';body={};}else{const o=$('consumer-release').selectedOptions[0];if(!o)throw Error('请先读取当前可用候选模板');url='/api/template-consumer/instances';body={release_id:o.value,expected_release_sha256:o.dataset.hash,goal:$('consumer-goal').value,reviewer_id:$('consumer-reviewer').value,materials:[{slot:'need_summary',text:$('consumer-need-summary').value,source_kind:'USER_STATEMENT',source_label:$('consumer-need-source').value},{slot:'material_outline',text:$('consumer-material-outline').value,source_kind:'DOCUMENT_EXCERPT',source_label:$('consumer-outline-source').value}],reason:'SYNTHETIC 明确以本企业新材料创建隔离新事项',...consumerDeclarations()};}cp={url,body,key:crypto.randomUUID(),state:'SUBMITTING',fields:captureFields(),goals:[...document.querySelectorAll('[data-consumer-goal]')].map(x=>[x.dataset.consumerGoal,x.checked])};}else if(!cp||cp.state!=='UNKNOWN')return;cp.wasUnknown=cp.wasUnknown||cp.state==='UNKNOWN';cp.state='SUBMITTING';buttons();const x=await call('consumer',cp.url,'POST',cp.body,cp.key,c);cp=null;$('consumer-retry').hidden=true;$('consumer-error').textContent='';renderInstance(x);}catch(e){if(current('consumer',c)&&cp){if(e.unknown){cp.state='UNKNOWN';$('consumer-retry').hidden=false;}else{if(e.code===403&&cp.wasUnknown)e.message+='；原操作仍可能已提交，当前拒绝不能证明之前未提交，须保留原请求键核对。';cp=null;}}fail('consumer',e,c);}buttons();}
function clearPlanning(){$('consumer-partial-confirm').checked=false;$('consumer-partial-label').hidden=true;pg++;planningView=null;confirmed=null;consumerDirty=false;$('consumer-planning').replaceChildren();if(!cp)$('consumer-plan-reason').value='';}
function templateGoals(){return catalog?.templates?.find(t=>t.release_id===$('consumer-release').value)?.required_goals||[];}
function renderConsumerGoals(selected=templateGoals(),mandatory=templateGoals()){const box=$('consumer-goals');box.replaceChildren();for(const goal of [...new Set([...(status?.registered_goals||Object.keys(goalLabels)), 'SYNTHETIC_EXTERNAL_AUTHORITY_APPROVAL',...selected])]){const label=node('label',goalLabels[goal]||goal),input=document.createElement('input');input.type='checkbox';input.dataset.consumerGoal=goal;input.dataset.mandatory=String(mandatory.includes(goal));input.checked=selected.includes(goal);input.style.width='auto';input.style.display='inline';input.onchange=consumerDraftChanged;label.append(input);box.append(label);}}
function consumerDeclarations(){const goals=[...document.querySelectorAll('[data-consumer-goal]:checked')].map(x=>x.dataset.consumerGoal);const required_goals=[...new Set([...templateGoals(),...(planningView?.request_intent?.required_goals||[]),...goals])];return {required_goals,planning_constraints:{excluded_roles:[['consumer-exclude-owner','enterprise_operator'],['consumer-exclude-specialist','park_specialist'],['consumer-exclude-executor','service_executor']].filter(([id])=>$(id).checked).map(([,role])=>role),additional_requirements:$('consumer-additional').value.split('\n').map(x=>x.trim()).filter(Boolean)}};}
function captureFields(){return Object.fromEntries(['consumer-goal',...planningFields].map(id=>[id,{value:$(id).value,checked:$(id).checked}]));}
function consumerDraftChanged(){if(adoptionHandle&&!cp){buttons();return;}if(cp){for(const [id,v] of Object.entries(cp.fields||{})){$(id).value=v.value;$(id).checked=v.checked;}for(const b of document.querySelectorAll('[data-consumer-goal]')){const saved=cp.goals?.find(([goal])=>goal===b.dataset.consumerGoal);if(saved)b.checked=saved[1];}buttons();return;}pg++;confirmed=null;$('consumer-partial-confirm').checked=false;consumerDirty=true;clearProductLink();buttons();}
function planningContext(){return {c:context('consumer'),pg,id:instance?.instance_id};}
function planningCurrent(x){return current('consumer',x.c)&&pg===x.pg&&instance?.instance_id===x.id;}
function renderPlanning(x){$('consumer-partial-confirm').checked=false;$('consumer-partial-label').hidden=confirmationMode(x)!=='PARTIAL';planningView=x;confirmed=null;consumerDirty=false;const intent=x.request_intent;$('consumer-goal').value=intent.current_request;const constraints=intent.planning_constraints||{excluded_roles:[],additional_requirements:[]};for(const [id,role] of [['consumer-exclude-owner','enterprise_operator'],['consumer-exclude-specialist','park_specialist'],['consumer-exclude-executor','service_executor']])$(id).checked=constraints.excluded_roles.includes(role);$('consumer-additional').value=constraints.additional_requirements.join('\n');renderConsumerGoals(intent.required_goals,intent.required_goals);const d=$('consumer-planning');d.replaceChildren();d.append(node('p','LOCAL 注册规则预览：'+x.current.state+' · 资料版本 '+x.current.preparation_revision+' · 必需目标 '+intent.required_goals.map(g=>goalLabels[g]||g).join('、')));if(x.current.partial_offer)d.append(node('p','可独立采纳步骤：'+x.current.partial_offer.step_ids.join(' → ')+'；等待依赖/约束：'+(x.current.partial_offer.waiting_step_ids.join('、')||'无')+'；待人工必需目标：'+x.current.partial_offer.manual_goals.map(g=>goalLabels[g]||g).join('、')+'。未知全局条件仍阻塞，不可改名转成独立目标。'));d.append(node('p','约束评估：'+(x.current.constraint_evaluation?.state||'未声明约束')+' · 不支持条件 '+(x.current.constraint_evaluation?.unsupported_requirements||[]).join('、')));for(const step of x.current.steps||[]){const a=node('article','步骤 '+step.id);for(const [label,value] of [['责任',step.responsibility],['依赖步骤',(step.depends_on||[]).join('、')||'无'],['前置条件',step.preconditions],['预期输出',step.output],['验收范围',step.acceptance],['当前材料或事实缺口',(step.issues||[]).join('、')||'无已知缺口'],['约束影响',step.constraint_impact?.state||'未声明']])a.append(node('p',label+'：'+(value||'未提供')));if(step.constraint_impact)a.append(node('p','必需角色：'+step.constraint_impact.required_roles.map(r=>({enterprise_operator:'企业操作员',park_specialist:'园区专员',service_executor:'执行者'}[r]||r)).join('、')+' · 前置冲突：'+step.constraint_impact.blocked_predecessors.join('、')));d.append(a);}buttons();}
async function loadConsumerPlanning(confirm=false){if(cp||adoptionHandle||!instance?.preparation_id)return;if(consumerDirty){$('consumer-error').textContent='请先保存本次修改，再读取并确认当前方案';return;}const prior=planningView;pg++;const ctx=planningContext();confirmed=null;buttons();try{const x=await call('consumer','/api/template-consumer/instances/'+ctx.id+'/planning','GET',undefined,undefined,ctx.c);if(!planningCurrent(ctx))return;if(x.instance_id!==ctx.id||x.preparation_id!==instance.preparation_id||x.case_id!==instance.case_id||x.run_id!==instance.run_id)throw Error('实例与方案身份无法核对');const v=x.current,sc=x.service_case_plan,sv=sc?.current_preview;if(x.actor_ref!==instance.actor_ref||sc?.actor_ref!==x.actor_ref||!/^([a-f0-9]{64})$/.test(x.actor_ref)||!v||!sv||![v,sc,sv].every(y=>y.preparation_id===x.preparation_id&&y.case_id===x.case_id&&y.run_id===x.run_id&&y.preparation_revision===v.preparation_revision)||sc.request_revision!==x.request_intent?.revision||sv.source_sha256!==v.source_sha256||JSON.stringify(sv)!==JSON.stringify(v)||!/^([a-f0-9]{64})$/.test(v.source_sha256)||JSON.stringify(v.required_goals)!==JSON.stringify(x.request_intent.required_goals)||JSON.stringify(sv.required_goals)!==JSON.stringify(v.required_goals)||x.plan_id!==sc.plan_id)throw Error('当前需求、嵌套方案与来源版本无法核对');if(confirm&&(!prior||x.current.source_sha256!==prior.current.source_sha256||x.current.preparation_revision!==prior.current.preparation_revision)){renderPlanning(x);$('consumer-error').textContent='来源已推进，请重新核对当前预览后确认';return;}renderPlanning(x);if(confirm&&confirmationMode(x)&&!x.plan_id){confirmed=x;$('consumer-planning').append(node('p','当前来源已核对；填写明确原因后才会采纳。来源 SHA256：'+x.current.source_sha256));}$('consumer-error').textContent='';buttons();}catch(e){if(!planningCurrent(ctx))return;clearPlanning();fail('consumer',e,ctx.c);}}
async function writeConsumerPlanning(adopt=false){if(cp||adoptionHandle||!instance?.preparation_id||!planningView)return;const c=context('consumer');try{let body;if(adopt){if(consumerDirty||!confirmed||!confirmationMode(confirmed))return;body={expected_preparation_revision:confirmed.current.preparation_revision,expected_request_revision:confirmed.request_intent.revision,expected_source_sha256:confirmed.current.source_sha256,expected_plan_revision:0,required_goals:confirmed.request_intent.required_goals,reason:$('consumer-plan-reason').value};if(!body.reason.trim())throw Error('请填写本次明确采纳原因');if(confirmationMode(confirmed)==='PARTIAL'){if(!$('consumer-partial-confirm').checked)throw Error('请明确确认独立部分，保留全部必需目标与整体PARTIAL');body.partial_adoption=true;}}else{if(!consumerDirty)return;body={expected_preparation_revision:planningView.current.preparation_revision,request_text:$('consumer-goal').value,...consumerDeclarations()};}cp={action:adopt?'CONFIRM_PLAN':'EDIT_REQUEST',url:'/api/template-consumer/instances/'+instance.instance_id+(adopt?'/adopt':'/planning'),body,key:crypto.randomUUID(),state:'SUBMITTING',fields:captureFields(),goals:[...document.querySelectorAll('[data-consumer-goal]')].map(x=>[x.dataset.consumerGoal,x.checked])};if(adopt){try{adoptionHandle=rememberAdoptionHandle(instance,confirmed,cp);}catch(e){cp=null;throw e;}}buttons();const x=await call('consumer',cp.url,'POST',cp.body,cp.key,c);if(adopt){cp.state='AWAITING_READ';await recoverConsumerAdoption();return;}cp=null;$('consumer-error').textContent='';renderInstance(x);}catch(e){if(current('consumer',c)&&cp){if(cp.action==='CONFIRM_PLAN'&&adoptionHandle){cp.state='UNKNOWN';e.unknown=true;$('consumer-retry').hidden=false;}else if(e.unknown){cp.state='UNKNOWN';$('consumer-retry').hidden=false;}else{if(e.code===403&&cp.wasUnknown)e.message+='；原操作仍可能已提交，当前拒绝不能证明之前未提交，须保留原请求键核对。';cp=null;}}fail('consumer',e,c);}buttons();}
$('consumer-partial-confirm').onchange=buttons;$('consumer-adoption-recover').onclick=recoverConsumerAdoption;$('consumer-adoption-finalize').onclick=finalizeConsumerAdoption;$('consumer-reconcile').onclick=()=>writeConsumer(false,false,true);$('consumer-preview').onclick=()=>loadConsumerPlanning();$('consumer-confirm').onclick=()=>loadConsumerPlanning(true);$('consumer-edit').onclick=()=>{if(cp)return;consumerDraftChanged();$('consumer-goal').focus();};$('consumer-save-request').onclick=()=>writeConsumerPlanning();$('consumer-adopt').onclick=()=>writeConsumerPlanning(true);for(const id of ['consumer-goal',...planningFields.filter(id=>!['consumer-plan-reason','consumer-partial-confirm'].includes(id))])$(id).oninput=consumerDraftChanged;$('consumer-release').onchange=()=>{if(cp)return;clearPlanning();renderConsumerGoals();buttons();};
document.querySelectorAll('[data-template-action]').forEach(b=>b.onclick=()=>writeTemplate(b.dataset.templateAction));$('template-retry').onclick=()=>writeTemplate(null,true);$('template-refresh').onclick=()=>loadTemplate();for(const id of ['template-actor','template-park','template-id'])$(id).onchange=clearTemplate;$('consumer-token').oninput=clearConsumer;$('consumer-catalog').onclick=loadCatalog;$('consumer-create').onclick=()=>writeConsumer();$('consumer-resume').onclick=()=>writeConsumer(true);$('consumer-retry').onclick=()=>writeConsumer(false,true);$('consumer-read').onclick=async(preferredName=null)=>{if(!cp){cg++;adoptionRecovering=false;clearPlanning();}const c=context('consumer');try{renderInstance(await call('consumer','/api/template-consumer/instances/'+encodeURIComponent($('consumer-instance-id').value),'GET',undefined,undefined,c),null,typeof preferredName==='string'?preferredName:null);}catch(e){fail('consumer',e,c);}};
(async()=>{try{status=await(await fetch('/api/template-candidate/status')).json();for(const p of status.isolated_personas||[]){const o=node('option',p.id+' · '+p.role);o.value=p.id;$('template-actor').append(o);}$('banner').textContent=status.enabled_for_isolated_tests?'显式隔离候选已启用；正式业务发布未启用。当前已有企业权限仍逐次核对。':'候选未启用：没有显式隔离合同，审核发布与新建事项均不可用。';buttons();}catch(e){$('template-error').textContent='无法读取候选配置';}})();
