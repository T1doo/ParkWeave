<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数化模板 · 隔离候选</title>
<style>*{box-sizing:border-box}body{max-width:1040px;margin:auto;padding:24px;background:#f3f6f3;color:#183b32;font:16px/1.6 system-ui}section{background:white;border:1px solid #dce5df;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;padding:10px;font:inherit;border:1px solid #bbc8bf;border-radius:6px}textarea{min-height:90px}button{font:inherit;padding:10px 14px;margin:5px 5px 5px 0;border:0;border-radius:7px;color:white;background:#22624d;max-width:100%}button:disabled{opacity:.4}p,article,pre,a{overflow-wrap:anywhere}pre{white-space:pre-wrap}article{border-top:1px solid #dce5df;padding:12px 0}.banner{padding:18px;background:#fff3d6;border:2px solid #c78a23}[hidden]{display:none!important}@media(max-width:600px){body{padding:12px}section{padding:14px}}</style>
<h1>参数化模板审核与新事项</h1><p class="banner" id="banner">隔离候选默认关闭。候选审核与发布不代表正式业务发布或企业资格确认。</p>
<section><h2>模板来源与候选审核</h2><label>隔离合同主体<select id="template-actor"></select></label><label>园区<input id="template-park" value="park-a"></label><label>模板标识<input id="template-id" value="template-materials"></label><button id="template-refresh">读取当前模板</button><p id="template-status" aria-live="polite"></p><p id="template-error" role="alert"></p>
<div id="template-editor"><label>模板名称<input id="template-name" value="SYNTHETIC 新企业材料准备模板"></label><label>来源版本<input id="template-source-revision" value="1"></label><label>合成来源说明<textarea id="template-source-statement">SYNTHETIC：每次使用须重新提交当前企业材料并由获派专员人工核对。</textarea></label></div>
<label>本次操作说明<textarea id="template-reason">SYNTHETIC 明确候选操作；正式发布仍未启用。</textarea></label><div id="template-actions"><button data-template-action="SAVE_DRAFT">保存草稿</button><button data-template-action="SUBMIT">提交候选审核</button><button data-template-action="RETURN_DRAFT">返回草稿</button><button data-template-action="REVIEW">确认候选审核</button><button data-template-action="REJECT">要求修订</button><button data-template-action="CANDIDATE_PUBLISH">生成候选发布快照</button><button data-template-action="WITHDRAW">撤回候选发布</button></div><button id="template-retry" hidden>以原请求重试未知结果</button><div id="template-history"></div></section>
<section><h2>当前企业新建事项</h2><p>模板只提供步骤和参数结构。每次填写新诉求与新材料；审核、确认和办理继续使用原事项入口。</p><label>当前企业访问令牌<input id="consumer-token" type="password" autocomplete="off"></label><button id="consumer-catalog">读取当前可用模板与获派专员</button><p id="consumer-scope"></p><label>当前候选发布版本<select id="consumer-release"></select></label><label>当前企业获派专员<select id="consumer-reviewer"></select></label><label>新事项诉求<textarea id="consumer-goal"></textarea></label><label>本次诉求摘要<textarea id="consumer-need-summary"></textarea></label><label>摘要来源说明<input id="consumer-need-source"></label><label>本次材料目录<textarea id="consumer-material-outline"></textarea></label><label>目录来源说明<input id="consumer-outline-source"></label><button id="consumer-create" disabled>使用模板创建新事项</button><button id="consumer-retry" hidden>以原请求重试未知结果</button><p id="consumer-status" aria-live="polite"></p><p id="consumer-error" role="alert"></p><div id="consumer-result"></div><label>读取已创建实例<input id="consumer-instance-id"></label><button id="consumer-read">读取当前实例</button><button id="consumer-resume" disabled>继续原实例准备</button><a href="/" id="product-link">进入原资料审核与步骤入口</a></section>
<script>
const $=id=>document.getElementById(id);let status=null,view=null,catalog=null,instance=null;let tg=0,cg=0,tp=null,cp=null;
function node(tag,value){const n=document.createElement(tag);n.textContent=value;return n;}
function context(channel){return channel==='template'?{g:tg,actor:$('template-actor').value,park:$('template-park').value,id:$('template-id').value}:{g:cg,token:$('consumer-token').value};}
function current(channel,c){const a=context(channel);return JSON.stringify(a)===JSON.stringify(c);}
function path(c){return '/api/template-candidate/'+encodeURIComponent(c.park)+'/'+encodeURIComponent(c.id);}
function clearTemplate(){tg++;view=null;tp=null;$('template-history').replaceChildren();$('template-status').textContent='';$('template-error').textContent='';$('template-retry').hidden=true;for(const id of ['template-name','template-source-revision','template-source-statement'])$(id).value='';buttons();}
function clearConsumer(){cg++;catalog=null;instance=null;cp=null;$('consumer-result').replaceChildren();$('consumer-release').replaceChildren();$('consumer-reviewer').replaceChildren();$('consumer-scope').textContent='';$('consumer-status').textContent='';$('consumer-error').textContent='';$('consumer-instance-id').value='';$('consumer-retry').hidden=true;for(const id of ['consumer-goal','consumer-need-summary','consumer-material-outline','consumer-need-source','consumer-outline-source'])$(id).value='';buttons();}
function buttons(){for(const id of ['template-name','template-source-revision','template-source-statement','template-reason'])$(id).disabled=!!tp;for(const id of ['consumer-release','consumer-reviewer','consumer-goal','consumer-need-summary','consumer-material-outline','consumer-need-source','consumer-outline-source'])$(id).disabled=!!cp;document.querySelectorAll('[data-template-action]').forEach(b=>b.disabled=!view||!!tp);$('consumer-create').disabled=!catalog||!$('consumer-release').value||!!cp;$('consumer-resume').disabled=!instance||instance.state==='PLAN_ADOPTED'||instance.release_available===false||!!cp;}
async function call(channel,url,method='GET',body,key,c=context(channel)){let r,x;try{r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(channel==='template'?{'X-Isolated-Template-Actor':c.actor}:{Authorization:'Bearer '+c.token}),...(key?{'Idempotency-Key':key}:{})},body:body===undefined?undefined:JSON.stringify(body)});x=await r.json();}catch(e){if(!current(channel,c))throw Error('STALE');e.unknown=method==='POST';throw e;}if(!current(channel,c))throw Error('STALE');if(!r.ok){const e=Error(r.status===403?'当前主体或范围无权访问，请重新核对身份':r.status===409?'版本、来源或授权已变化，请读取当前状态':r.status===422?'输入不符合当前模板合同':String(x.detail||'请求未完成'));e.code=r.status;e.unknown=method==='POST'&&r.status>=500;throw e;}return x;}
function fail(channel,e,c){if(e.message==='STALE'||!current(channel,c))return;$(channel==='template'?'template-error':'consumer-error').textContent=e.unknown?'结果未知，请保留当前身份并以原请求重试。':e.message;if(e.code===403){if(channel==='template')clearTemplate();else clearConsumer();$(channel==='template'?'template-error':'consumer-error').textContent=e.message;}buttons();}
function renderTemplate(x){view=x;$('template-status').textContent=x.state+' · 操作版本 '+x.revision+' · 内容版本 '+x.content_version+' · 当前可用 '+Boolean(x.candidate_available)+' · 正式业务发布未启用';const h=$('template-history');h.replaceChildren();if(!x.draft&&status?.example_definition){const d=status.example_definition;$('template-name').value=d.name;$('template-source-revision').value=d.source.revision;$('template-source-statement').value=d.source.statement;}if(x.draft){$('template-name').value=x.draft.name;$('template-source-revision').value=x.draft.source.revision;$('template-source-statement').value=x.draft.source.statement;h.append(node('p','定义 SHA256：'+x.definition_sha256),node('p','必需目标：'+x.draft.required_goals.join('、')));}for(const e of x.history||[])h.append(node('article',JSON.stringify(e)));for(const r of x.releases||[])h.append(node('article','候选快照 '+r.release_id+' · '+r.state+' · '+r.release_sha256));buttons();}
async function loadTemplate(c=context('template')){try{renderTemplate(await call('template',path(c),'GET',undefined,undefined,c));}catch(e){fail('template',e,c);}}
function draft(){if(!status?.example_definition)throw Error('缺少显式模板参数合同');const d=structuredClone(view?.draft||status.example_definition);d.name=$('template-name').value;d.source.revision=$('template-source-revision').value;d.source.statement=$('template-source-statement').value;return d;}
async function writeTemplate(action,retry=false){const c=context('template');try{if(!retry){if(tp||!view)return;const body={action,expected_revision:view.revision,expected_definition_sha256:view.definition_sha256,reason:$('template-reason').value};if(action==='SAVE_DRAFT')body.draft=draft();if(action==='CANDIDATE_PUBLISH')body.validity=view.draft.source.validity;tp={url:path(c)+'/commands',body,key:crypto.randomUUID(),state:'SUBMITTING'};}else if(!tp||tp.state!=='UNKNOWN')return;tp.state='SUBMITTING';buttons();await call('template',tp.url,'POST',tp.body,tp.key,c);tp=null;$('template-retry').hidden=true;await loadTemplate(c);}catch(e){if(current('template',c)&&tp){if(e.unknown){tp.state='UNKNOWN';$('template-retry').hidden=false;}else tp=null;}fail('template',e,c);}buttons();}
function renderInstance(x){instance=x;$('consumer-instance-id').value=x.instance_id;$('consumer-status').textContent='实例 '+x.state+' · 候选版本当前可用 '+x.release_available+' · 原目标完成仍未验证';const d=$('consumer-result');d.replaceChildren();for(const [label,key] of [['新 Run','run_id'],['新 Case','case_id'],['资料事项','preparation_id'],['注册步骤计划','plan_id']])d.append(node('p',label+'：'+(x[key]||'尚未生成')));d.append(node('p','不可变候选绑定：'+JSON.stringify(x.binding)));buttons();}
async function loadCatalog(){const c=context('consumer');try{catalog=await call('consumer','/api/template-consumer/catalog','GET',undefined,undefined,c);$('consumer-scope').textContent='当前服务端身份范围 '+catalog.park_id+' / '+catalog.org_id+' · 正式发布未启用';$('consumer-release').replaceChildren();for(const t of catalog.templates||[]){const o=node('option',t.name+' · '+t.release_id);o.value=t.release_id;o.dataset.hash=t.release_sha256;$('consumer-release').append(o);}$('consumer-reviewer').replaceChildren();for(const r of catalog.reviewers||[]){const o=node('option',r.id);o.value=r.id;$('consumer-reviewer').append(o);}$('consumer-error').textContent='';buttons();}catch(e){fail('consumer',e,c);}}
async function writeConsumer(resume=false,retry=false){const c=context('consumer');try{if(!retry){if(cp)return;let body,url;if(resume){if(!instance)return;url='/api/template-consumer/instances/'+encodeURIComponent(instance.instance_id)+'/resume';body={};}else{const o=$('consumer-release').selectedOptions[0];if(!o)throw Error('请先读取当前可用候选模板');url='/api/template-consumer/instances';body={release_id:o.value,expected_release_sha256:o.dataset.hash,goal:$('consumer-goal').value,reviewer_id:$('consumer-reviewer').value,materials:[{slot:'need_summary',text:$('consumer-need-summary').value,source_kind:'USER_STATEMENT',source_label:$('consumer-need-source').value},{slot:'material_outline',text:$('consumer-material-outline').value,source_kind:'DOCUMENT_EXCERPT',source_label:$('consumer-outline-source').value}],reason:'SYNTHETIC 明确以本企业新材料创建隔离新事项'};}cp={url,body,key:crypto.randomUUID(),state:'SUBMITTING'};}else if(!cp||cp.state!=='UNKNOWN')return;cp.state='SUBMITTING';buttons();const x=await call('consumer',cp.url,'POST',cp.body,cp.key,c);cp=null;$('consumer-retry').hidden=true;$('consumer-error').textContent='';renderInstance(x);}catch(e){if(current('consumer',c)&&cp){if(e.unknown){cp.state='UNKNOWN';$('consumer-retry').hidden=false;}else cp=null;}fail('consumer',e,c);}buttons();}
document.querySelectorAll('[data-template-action]').forEach(b=>b.onclick=()=>writeTemplate(b.dataset.templateAction));$('template-retry').onclick=()=>writeTemplate(null,true);$('template-refresh').onclick=()=>loadTemplate();for(const id of ['template-actor','template-park','template-id'])$(id).onchange=clearTemplate;$('consumer-token').oninput=clearConsumer;$('consumer-catalog').onclick=loadCatalog;$('consumer-create').onclick=()=>writeConsumer();$('consumer-resume').onclick=()=>writeConsumer(true);$('consumer-retry').onclick=()=>writeConsumer(false,true);$('consumer-read').onclick=async()=>{const c=context('consumer');try{renderInstance(await call('consumer','/api/template-consumer/instances/'+encodeURIComponent($('consumer-instance-id').value),'GET',undefined,undefined,c));}catch(e){fail('consumer',e,c);}};
(async()=>{try{status=await(await fetch('/api/template-candidate/status')).json();for(const p of status.isolated_personas||[]){const o=node('option',p.id+' · '+p.role);o.value=p.id;$('template-actor').append(o);}$('banner').textContent=status.enabled_for_isolated_tests?'显式隔离候选已启用；正式业务发布未启用。当前已有企业权限仍逐次核对。':'候选未启用：没有显式隔离合同，审核发布与新建事项均不可用。';buttons();}catch(e){$('template-error').textContent='无法读取候选配置';}})();
</script></html>
