<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>园合 ParkWeave · 合成工程验证</title>
<style>body{max-width:850px;margin:40px auto;padding:0 20px;font:16px system-ui;color:#20332d;background:#f4f6f3}nav{display:flex;flex-wrap:wrap;gap:8px;padding:18px 0;border-bottom:1px solid #ccc}section{padding:24px;background:white;margin:16px 0;border-radius:10px}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{min-height:44px;padding:10px 20px;background:#245944;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#526157}@media(max-width:480px){body{margin:20px auto;padding:0 12px}section{padding:16px}h1{font-size:28px}}</style>
<h1>园合 ParkWeave</h1><p>企业说目标，园区交付服务。</p><strong>合成工程验证 · 未接入真实园区或模型</strong>
<nav><button data-tab="service">服务</button><button data-tab="collaboration">协同</button><button data-tab="resource">资源</button></nav>
<section><label>合成身份会话<input id="token" type="password" autocomplete="off"></label><small>仅用于本机合成测试；会话只保存在当前页面内存。</small></section>
<section id="service"><h2>提出服务诉求</h2><form id="intake"><textarea id="goal" maxlength="2000" required placeholder="描述本次测试目标"></textarea><button>创建本地办理记录</button></form><p>本增量仅建立待补件记录，不代表外部受理或线下履约。</p></section>
<section id="collaboration" hidden><h2>协同</h2><label>运行编号<input id="run"></label><button id="refresh">查看持久状态</button><button data-control="pause">暂停</button><button data-control="resume">继续</button><button data-control="cancel">取消</button><button data-control="reconcile">核对结果</button></section>
<section><h2>三项事实与必要澄清</h2><p>仅合成数据。自述和文档摘录都是未核实来源，候选不代表资格通过。</p><form id="candidate-intake"><label>地区<input id="candidate-region" maxlength="2000"></label><label>员工人数<input id="candidate-employees" type="number" min="0" step="1"></label><label>服务诉求<input id="candidate-service_need" maxlength="2000"></label><button>评审三项候选</button></form><button id="review">集中查看必要问题</button><form id="clarifications" hidden><div id="questions"></div><label>补充自述的来源版本<input id="answer-version" value="1" maxlength="40" required></label><button>提交补充自述</button><button id="cancel-clarification" type="button">取消本次补充</button><small>补充后重新评审，旧来源和历史保留；仍需授权核查。</small></form></section>
<section id="resource" hidden><h2>资源</h2><p>当前可信目录：合成本地诉求受理 case.create/1；资格无需判断。预约、材料上传、外部系统和真实政策目录尚未启用。</p></section>
<section><h2>记录</h2><pre id="result" aria-live="polite">暂无记录</pre></section>
<script>
const $=id=>document.getElementById(id);const show=x=>$('result').textContent=JSON.stringify(x,null,2);
async function apiCall(path,method='GET',body,key){const headers={'Authorization':'Bearer '+$('token').value};if(body)headers['Content-Type']='application/json';if(key)headers['Idempotency-Key']=key;const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});const x=await r.json();show(x);if(!r.ok)throw Error('请求未完成');return x;}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>['service','collaboration','resource'].forEach(id=>$(id).hidden=id!==b.dataset.tab));
$('intake').onsubmit=async e=>{e.preventDefault();try{const x=await apiCall('/api/runs','POST',{goal:$('goal').value},crypto.randomUUID());$('run').value=x.run_id;}catch(e){show({error:e.message});}};
$('refresh').onclick=()=>apiCall('/api/runs/'+encodeURIComponent($('run').value)).catch(e=>show({error:e.message}));
document.querySelectorAll('[data-control]').forEach(b=>b.onclick=()=>apiCall('/api/runs/'+encodeURIComponent($('run').value)+'/'+b.dataset.control,'POST').catch(e=>show({error:e.message})));
const fields=['region','employees','service_need'];let currentReview=null,lastClarification=null,clarificationKey=null;
function assertion(field,value,revision='1'){const now=Date.now();return {schema_version:'parkweave-domain/1.0-draft',field,value:field==='employees'?Number(value):value,unit:field==='employees'?'people':'text',source_ref:{id:'synthetic-page-statement',kind:'SYNTHETIC',revision},source_excerpt:String(value),validity:{valid_from:new Date(now-1000).toISOString(),valid_until:new Date(now+86400000).toISOString(),timezone:'UTC'}};}
$('candidate-intake').onsubmit=async e=>{e.preventDefault();try{const items=fields.filter(f=>$('candidate-'+f).value.trim()!=='').map(f=>({...assertion(f,$('candidate-'+f).value),origin:'USER_STATEMENT'}));const x=await apiCall('/api/runs','POST',{action:'facts.assess',goal:'合成：三项事实候选评审',fact_fields:fields,candidate_review:true,fact_candidates:items},crypto.randomUUID());$('run').value=x.run_id;currentReview=null;$('clarifications').hidden=true;}catch(e){show({error:e.message});}};
$('review').onclick=async()=>{try{const x=await apiCall('/api/runs/'+encodeURIComponent($('run').value)+'/fact-review');currentReview=x;lastClarification=null;$('questions').replaceChildren();for(const q of x.document.necessary_questions){const label=document.createElement('label');label.textContent=q.prompt;const input=document.createElement('input');input.id='answer-'+q.field;input.maxLength=2000;if(q.field==='employees'){input.type='number';input.min='0';input.step='1';}label.append(input);$('questions').append(label);}$('clarifications').hidden=false;}catch(e){currentReview=null;$('clarifications').hidden=true;show({error:e.message});}};
async function sendClarification(decision){if(!currentReview)throw Error('请先读取评审');const answers=decision==='CANCEL'?[]:fields.filter(f=>$('answer-'+f)&&$('answer-'+f).value.trim()!=='').map(f=>assertion(f,$('answer-'+f).value,$('answer-version').value));if(decision==='ANSWER'&&!answers.length)throw Error('请至少补充一项');const signature=JSON.stringify({parent:currentReview.run_id,decision,answers:answers.map(a=>[a.field,a.value,a.source_ref.revision])});if(signature!==lastClarification){clarificationKey=crypto.randomUUID();lastClarification=signature;sendClarification.body={review_sha256:currentReview.sha256,decision,answers};}const x=await apiCall('/api/runs/'+encodeURIComponent(currentReview.run_id)+'/clarifications','POST',sendClarification.body,clarificationKey);if(x.run_id)$('run').value=x.run_id;$('clarifications').hidden=true;currentReview=null;}
$('clarifications').onsubmit=e=>{e.preventDefault();sendClarification('ANSWER').catch(e=>show({error:e.message}));};$('cancel-clarification').onclick=()=>sendClarification('CANCEL').catch(e=>show({error:e.message}));
$('token').oninput=()=>{currentReview=null;lastClarification=null;$('questions').replaceChildren();$('clarifications').hidden=true;};
</script></html>
