<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>园合 ParkWeave</title>
<link rel="icon" href="assets/parkweave-mark-128.png"><link rel="stylesheet" href="workspace_design.css"><link rel="stylesheet" href="demo-workspace.css">
</head>
<body class="desktop-shell demo-shell" data-effects="glass">
<a class="demo-skip" href="#demo-main">跳到工作区</a>
<aside class="app-sidebar demo-sidebar" aria-label="应用侧栏">
<div class="demo-brand"><img src="assets/parkweave-mark-128.png" alt="园合"><div><strong>园合</strong><span>ParkWeave</span></div></div>
<p class="demo-brand-line">让园区服务围绕目标协同</p>
<nav class="workspace-nav demo-nav" aria-label="工作区">
<button data-view="service" aria-current="page"><span class="nav-symbol">01</span>服务工作台</button>
<button data-view="resource"><span class="nav-symbol">02</span>资源与空间</button>
<button data-view="collaboration"><span class="nav-symbol">03</span>协同待办</button>
<button data-view="detail"><span class="nav-symbol">04</span>事项档案</button>
</nav>
<div class="demo-role-panel"><label for="demo-role">当前角色</label><select id="demo-role"><option value="enterprise">企业负责人</option><option value="specialist">园区专员</option><option value="executor">执行人员</option><option value="resource-admin">资源管理员</option></select><div class="demo-identity"><span id="demo-avatar">企</span><div><strong id="demo-role-name">企业负责人</strong><small>澄光智能科技</small></div></div></div>
<div class="demo-sidebar-bottom"><button id="demo-reset" class="demo-reset">新建事项</button></div>
</aside>
<main id="demo-main" tabindex="-1"><header class="demo-topbar"><div><span class="demo-park">星澜创新园</span><span class="demo-separator">/</span><strong id="demo-page-title">服务工作台</strong></div><div class="demo-topbar-actions"><button id="demo-export-menu" class="compact-button">导出办理文件</button></div></header><div id="demo-content"></div></main>
<div id="demo-toast" class="demo-toast" role="status" aria-live="polite" hidden></div>
<dialog id="demo-dialog" aria-labelledby="demo-dialog-title"></dialog>
<script src="demo-workspace.js"></script>
</body></html>
